[package]
name = "multimedia-downloader"
version = "4.3.23"
description = "Multimedia Downloader V4.0 — Tauri desktop shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2.5.4"

[profile.release]
strip = true
lto = true

# OpenAI-Codex: use the verified, pinned GLib 0.18 soundness backport.
[patch.crates-io]
glib = { git = "https://github.com/KingsleyHK0323/Multimedia_Downloader", rev = "1677375f54686a3fe2f1f383e068aa005606013b" }
