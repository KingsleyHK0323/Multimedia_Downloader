# OpenAI-Codex: generate API documentation and refresh the approved Pages site.
name: API documentation build

on:
  push:
    branches: [Source_Code]
    paths:
      - 'engine/**'
      - 'ai/**'
      - 'i18n/**'
      - 'locales/**'
      - 'requirements-web.txt'
      - .github/workflows/api-docs.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: python -m pip install pdoc==15.0.4 -r requirements-web.txt
      - name: Generate HTML reference
        run: python -m pdoc -o api-docs engine ai i18n
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-api-documentation
          path: api-docs/
          if-no-files-found: error
          retention-days: 7

      # OpenAI-Codex: bot-triggered deployments must be dispatched explicitly.
      - name: Refresh API reference on Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref Multimedia_Downloader_Website
