# OpenAI-Codex_ruleset_architecture: update only Source_Code after a verified health candidate passes CI.
name: Update verified health report after checks
on:
  workflow_run:
    workflows: [CI, Python matrix tests]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '45 */6 * * *'
permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
jobs:
  update-health:
    if: >-
      github.repository == 'KingsleyHK0323/Multimedia_Downloader' &&
      github.ref == 'refs/heads/Source_Code' &&
      vars.AUTOMATION_PR_MODE == 'enabled' &&
      vars.AUTOMATION_HEALTH_CAS == 'enabled'
    concurrency:
      group: automation-service-reconcile
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact source ref
        env:
          ACTUAL_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ACTUAL_REF" == 'refs/heads/Source_Code' && "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo '::error::Unexpected source ref or workflow revision.'; exit 1; }
          tip="$(gh api repos/KingsleyHK0323/Multimedia_Downloader/git/ref/heads/Source_Code --jq '.object.sha')"
          [[ "$tip" == "$WORKFLOW_SHA" ]] || { echo '::error::Source_Code changed before token creation.'; exit 1; }
      - name: Create a repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: '5868451'
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Verify and update the exact Source_Code ref
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        with:
          script: |
            // OpenAI-Codex_ruleset_architecture: use push CI and a single-parent CAS for one deterministic health report.
            const { owner, repo } = context.repo;
            const fullName = 'KingsleyHK0323/Multimedia_Downloader';
            const baseName = 'Source_Code';
            const repositoryId = 1251103365;
            const path = '.github/automation/ci-health.json';
            const bot = 'kingsley-multimedia-automation[bot]';
            const branchPattern = /^automation\/protected-workflows$/;
            const sha = (value) => typeof value === 'string' && /^[0-9a-f]{40}$/.test(value);
            const crypto = require('node:crypto');
            if (owner + '/' + repo !== fullName || context.ref !== 'refs/heads/Source_Code' ||
                process.env.APP_SLUG !== 'kingsley-multimedia-automation' ||
                typeof process.env.APP_TOKEN !== 'string' || !process.env.APP_TOKEN.trim() ||
                !sha(process.env.WORKFLOW_SHA)) {
              throw new Error('Unexpected repository or App identity.');
            }
            const app = getOctokit(process.env.APP_TOKEN);
            const appInfo = (await app.request('GET /apps/{app_slug}', { app_slug: process.env.APP_SLUG })).data;
            const botInfo = (await app.rest.users.getByUsername({ username: bot })).data;
            if (appInfo?.id !== 5868451 || appInfo.slug !== process.env.APP_SLUG ||
                botInfo?.id !== 359694872 || botInfo.login !== bot || botInfo.type !== 'Bot') {
              throw new Error('The automation App or bot identity cannot be verified.');
            }
            const isBot = (user) => user?.id === 359694872 && user.login === bot && user.type === 'Bot';
            const blobSha = (bytes) => crypto.createHash('sha1')
              .update('blob ' + bytes.length + '\0').update(bytes).digest('hex');
            const getRef = async (branch) => {
              const data = (await github.rest.git.getRef({ owner, repo, ref: 'heads/' + branch })).data;
              if (!data || data.ref !== 'refs/heads/' + branch || data.object?.type !== 'commit' || !sha(data.object.sha)) {
                throw new Error('Branch ref is incomplete.');
              }
              return data.object.sha;
            };
            const getCommit = async (commitSha) => {
              const data = (await github.rest.git.getCommit({ owner, repo, commit_sha: commitSha })).data;
              if (!data || data.sha !== commitSha || !sha(data.tree?.sha)) throw new Error('Commit metadata is incomplete.');
              return data;
            };
            const treeEntry = async (treeSha, name) => {
              const data = (await github.rest.git.getTree({ owner, repo, tree_sha: treeSha })).data;
              if (!data || data.sha !== treeSha || data.truncated !== false || !Array.isArray(data.tree)) {
                throw new Error('Git tree is incomplete.');
              }
              const entries = data.tree.filter((entry) => entry.path === name);
              if (entries.length !== 1 || !sha(entries[0].sha)) throw new Error('Report tree entry is missing or ambiguous.');
              return entries[0];
            };
            const reportEntry = async (commitSha) => {
              const commit = await getCommit(commitSha);
              const gh = await treeEntry(commit.tree.sha, '.github');
              if (gh.type !== 'tree' || gh.mode !== '040000') throw new Error('Unexpected .github tree entry.');
              const automation = await treeEntry(gh.sha, 'automation');
              if (automation.type !== 'tree' || automation.mode !== '040000') throw new Error('Unexpected automation tree entry.');
              const file = await treeEntry(automation.sha, 'ci-health.json');
              if (file.type !== 'blob' || file.mode !== '100644') throw new Error('Health report is not a regular file.');
              return file;
            };
            const readFile = async (ref, expectedSha) => {
              const data = (await github.rest.repos.getContent({ owner, repo, path, ref })).data;
              if (!data || data.type !== 'file' || data.encoding !== 'base64' ||
                  typeof data.content !== 'string' || data.sha !== expectedSha) {
                throw new Error('Report content is incomplete.');
              }
              const encoded = data.content.replace(/\s/g, '');
              if (!encoded || !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encoded)) {
                throw new Error('Report content is not valid base64.');
              }
              const bytes = Buffer.from(encoded, 'base64');
              if (bytes.toString('base64') !== encoded || blobSha(bytes) !== expectedSha) {
                throw new Error('Report content does not match its blob.');
              }
              return bytes;
            };
            const latestReport = async () => {
              const data = (await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'ci.yml', branch: baseName, event: 'schedule', per_page: 1,
              })).data;
              if (!data || !Number.isSafeInteger(data.total_count) || data.total_count < 1 ||
                  !Array.isArray(data.workflow_runs) || data.workflow_runs.length !== 1) {
                throw new Error('The latest scheduled CI run is unavailable.');
              }
              const run = data.workflow_runs[0];
              const conclusions = new Set(['success', 'failure', 'neutral', 'cancelled', 'skipped', 'timed_out', 'action_required', 'startup_failure', 'stale']);
              if (!run || !Number.isSafeInteger(run.id) || run.id < 1 || !Number.isSafeInteger(run.run_attempt) ||
                  run.run_attempt < 1 || run.path !== '.github/workflows/ci.yml' || run.event !== 'schedule' ||
                  run.head_branch !== baseName || run.repository?.id !== repositoryId ||
                  run.head_repository?.id !== repositoryId || run.status !== 'completed' || !conclusions.has(run.conclusion) ||
                  run.html_url !== 'https://github.com/' + fullName + '/actions/runs/' + run.id) {
                throw new Error('The latest scheduled CI metadata is incomplete.');
              }
              return Buffer.from(JSON.stringify({
                generated_by: 'OpenAI-Codex', workflow: 'ci.yml', event: 'schedule', branch: baseName,
                run_id: run.id, run_attempt: run.run_attempt, status: run.status, conclusion: run.conclusion, url: run.html_url,
              }, null, 2) + '\n', 'utf8');
            };
            const ruleSnapshot = async () => {
              // OpenAI-Codex_ruleset_architecture: the App must not bypass Source_Code checks.
              const repository = (await app.rest.repos.get({ owner, repo })).data;
              if (!repository || repository.id !== repositoryId || repository.full_name !== fullName ||
                  typeof repository.node_id !== 'string' || !repository.node_id) {
                throw new Error('Repository identity is incomplete.');
              }
              const rules = await app.paginate('GET /repos/{owner}/{repo}/rules/branches/{branch}', {
                owner, repo, branch: baseName, per_page: 100,
              });
              if (!Array.isArray(rules) || !rules.length || rules.length > 1000 ||
                  rules.some((r) => !r || !Number.isSafeInteger(r.ruleset_id) || r.ruleset_id < 1 ||
                    !['Repository', 'Organization'].includes(r.ruleset_source_type) ||
                    typeof r.ruleset_source !== 'string' || typeof r.type !== 'string')) {
                throw new Error('Active Source_Code rules are incomplete.');
              }
              const ids = [...new Set(rules.map((r) => r.ruleset_id))].sort((a, b) => a - b);
              const details = [];
              for (const id of ids) {
                const detail = (await app.request('GET /repos/{owner}/{repo}/rulesets/{ruleset_id}', {
                  owner, repo, ruleset_id: id, includes_parents: true,
                })).data;
                if (!detail || detail.id !== id || detail.enforcement !== 'active' || detail.target !== 'branch' ||
                    detail.current_user_can_bypass !== 'never' || !Array.isArray(detail.rules)) {
                  throw new Error('An active Source_Code ruleset is unavailable or bypassable by the App.');
                }
                details.push({ id, rules: detail.rules, enforcement: detail.enforcement,
                  current_user_can_bypass: detail.current_user_can_bypass, conditions: detail.conditions });
              }
              if (!rules.some((r) => r.type === 'non_fast_forward') ||
                  rules.some((r) => r.type === 'pull_request' || r.type === 'update')) {
                throw new Error('Source_Code must forbid force pushes and permit checked direct updates.');
              }
              const protectedChecks = new Set();
              for (const rule of rules.filter((r) => r.type === 'required_status_checks')) {
                const p = rule.parameters;
                if (!p || typeof p.strict_required_status_checks_policy !== 'boolean' ||
                    !Array.isArray(p.required_status_checks) || !p.required_status_checks.length) {
                  throw new Error('A required-check rule is incomplete.');
                }
                for (const check of p.required_status_checks) {
                  if (check?.integration_id === 15368 &&
                      ['Required CI', 'Required Python matrix'].includes(check.context)) {
                    protectedChecks.add(check.context);
                  }
                }
              }
              if (!protectedChecks.has('Required CI') || !protectedChecks.has('Required Python matrix')) {
                throw new Error('Required CI and matrix checks from GitHub Actions are not active.');
              }
              return { nodeId: repository.node_id, snapshot: JSON.stringify({
                rules: [...rules].sort((a, b) => a.ruleset_id - b.ruleset_id || a.type.localeCompare(b.type)),
                details,
              }) };
            };
            const inspectTree = async (base, head) => {
              const [baseCommit, headCommit, headDetails] = await Promise.all([
                getCommit(base), getCommit(head), github.rest.repos.getCommit({ owner, repo, ref: head }),
              ]);
              const signed = headDetails.data;
              if (!signed || signed.sha !== head || !isBot(signed.author) ||
                  signed.commit?.verification?.verified !== true || signed.commit.verification.reason !== 'valid' ||
                  signed.committer?.id !== 19864447 || signed.commit.tree?.sha !== headCommit.tree.sha ||
                  !Array.isArray(signed.parents) || signed.parents.length !== 1 || signed.parents[0]?.sha !== base ||
                  !Array.isArray(headCommit.parents) || headCommit.parents.length !== 1 ||
                  headCommit.parents[0]?.sha !== base) {
                throw new Error('Health head is not a verified App-authored single child of Source_Code.');
              }
              const inventories = await Promise.all([baseCommit.tree.sha, headCommit.tree.sha].map(async (treeSha) => {
                const tree = (await github.rest.git.getTree({ owner, repo, tree_sha: treeSha, recursive: '1' })).data;
                if (!tree || tree.sha !== treeSha || tree.truncated !== false || !Array.isArray(tree.tree) ||
                    tree.tree.length > 100000) throw new Error('Git tree inventory is incomplete.');
                const result = new Map();
                for (const item of tree.tree) {
                  if (!item || typeof item.path !== 'string' || !item.path || result.has(item.path) ||
                      !sha(item.sha) || typeof item.mode !== 'string' ||
                      !['tree', 'blob', 'commit'].includes(item.type)) {
                    throw new Error('Git tree entry is malformed or duplicated.');
                  }
                  result.set(item.path, item);
                }
                return result;
              }));
              const [before, after] = inventories;
              if (before.size !== after.size) throw new Error('Health candidate changed the tree inventory.');
              const parents = new Set(['.github', '.github/automation']);
              for (const [name, prior] of before) {
                const next = after.get(name);
                if (!next || prior.mode !== next.mode || prior.type !== next.type) {
                  throw new Error('Health candidate changed a path, mode, or type.');
                }
                if (name === path) {
                  if (prior.type !== 'blob' || prior.mode !== '100644' || prior.sha === next.sha) {
                    throw new Error('Health report did not change as a regular file.');
                  }
                } else if (parents.has(name)) {
                  if (prior.type !== 'tree' || prior.mode !== '040000') {
                    throw new Error('Health directory identity is invalid.');
                  }
                } else if (prior.sha !== next.sha) {
                  throw new Error('Health candidate modified another tree entry: ' + name);
                }
              }
              for (const name of [path, '.github', '.github/automation',
                '.github/workflows/ci.yml', '.github/workflows/python-matrix.yml']) {
                if (!before.has(name) || !after.has(name)) throw new Error('A required tree entry is missing.');
              }
              return after.get(path).sha;
            };
            const inspectPr = async (number) => {
              const pr = (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
              const base = await getRef(baseName);
              if (!pr || pr.number !== number || pr.state !== 'open' || !isBot(pr.user) ||
                  base !== process.env.WORKFLOW_SHA ||
                  pr.base?.repo?.id !== repositoryId || pr.base.repo.full_name !== fullName ||
                  pr.base?.ref !== baseName || pr.base?.sha !== base ||
                  pr.head?.repo?.id !== repositoryId || pr.head.repo.full_name !== fullName ||
                  typeof pr.head?.ref !== 'string' || !branchPattern.test(pr.head.ref) || !sha(pr.head.sha) ||
                  pr.draft !== false || pr.auto_merge !== null ||
                  !Array.isArray(pr.labels) || !pr.labels.every((label) => typeof label?.name === 'string') ||
                  pr.labels.some((label) => label.name.toLowerCase() === 'release:patch') ||
                  pr.changed_files !== 1 || pr.html_url !== 'https://github.com/' + fullName + '/pull/' + number ||
                  await getRef(pr.head.ref) !== pr.head.sha) {
                throw new Error('Health PR identity, source revision, refs, or labels are unsafe.');
              }
              const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number, per_page: 100 });
              if (!Array.isArray(files) || files.length !== 1 || files[0]?.filename !== path ||
                  files[0]?.status !== 'modified' || files[0]?.previous_filename !== undefined || !sha(files[0]?.sha)) {
                throw new Error('Health PR must change exactly the report file.');
              }
              const reportBlob = await inspectTree(base, pr.head.sha);
              await reportEntry(base);
              const entry = await reportEntry(pr.head.sha);
              const report = await latestReport();
              if (entry.sha !== reportBlob || entry.sha !== files[0].sha || entry.sha !== blobSha(report) ||
                  !(await readFile(pr.head.sha, entry.sha)).equals(report)) {
                throw new Error('Health PR report is not the latest trusted CI report.');
              }
              return { number, base, head: pr.head.sha, branch: pr.head.ref, report: entry.sha };
            };
            const getRuns = async (head) => {
              const all = [];
              let total;
              for (let page = 1; page <= 10; page++) {
                const data = (await github.rest.actions.listWorkflowRunsForRepo({
                  owner, repo, event: 'push', head_sha: head, per_page: 100, page,
                })).data;
                if (!data || !Number.isSafeInteger(data.total_count) || data.total_count < 0 || data.total_count > 1000 ||
                    !Array.isArray(data.workflow_runs) || data.workflow_runs.length > 100 ||
                    (total !== undefined && data.total_count !== total)) {
                  throw new Error('PR workflow run pagination is incomplete.');
                }
                total = data.total_count;
                all.push(...data.workflow_runs);
                if (all.length >= total) break;
                if (data.workflow_runs.length !== 100) throw new Error('PR workflow run page is incomplete.');
              }
              if (all.length !== total) throw new Error('PR workflow run count is incomplete.');
              return all;
            };
            const selectRuns = (runs, pr) => {
              const expected = [
                ['.github/workflows/ci.yml', 'CI', 318584423],
                ['.github/workflows/python-matrix.yml', 'Python matrix tests', 422035428],
              ];
              return expected.map(([pathName, workflowName, workflowId]) => {
                const matches = runs.filter((run) => run?.path === pathName &&
                  run.head_sha === pr.head && run.head_branch === pr.branch);
                if (matches.length === 0) return null;
                if (matches.length !== 1) throw new Error('Multiple push runs make the tested commit ambiguous.');
                const run = matches[0];
                if (['queued', 'in_progress', 'waiting', 'requested', 'pending'].includes(run.status)) return null;
                const age = Date.now() - Date.parse(run.created_at);
                if (!Number.isSafeInteger(run.id) || run.id < 1 || run.name !== workflowName ||
                    run.workflow_id !== workflowId || run.event !== 'push' || !isBot(run.actor) ||
                    run.repository?.id !== repositoryId || run.repository.full_name !== fullName ||
                    run.head_repository?.id !== repositoryId || run.head_repository.full_name !== fullName ||
                    run.status !== 'completed' || run.conclusion !== 'success' ||
                    !Number.isSafeInteger(run.run_attempt) || run.run_attempt < 1 || run.run_attempt > 10 ||
                    !Number.isFinite(age) || age < -60000 || age > 6 * 24 * 60 * 60 * 1000) {
                  throw new Error('The exact App push CI or matrix run is not trusted and successful.');
                }
                return { id: run.id, attempt: run.run_attempt, path: pathName, head: pr.head };
              });
            };
            const successfulJobs = async (run, required) => {
              // A partial rerun retains successful jobs from earlier attempts.
              const latest = new Map();
              const seenIds = new Set();
              for (let attempt = 1; attempt <= run.attempt; attempt++) {
                const data = (await github.rest.actions.listJobsForWorkflowRunAttempt({
                  owner, repo, run_id: run.id, attempt_number: attempt, per_page: 100,
                })).data;
                if (!data || !Number.isSafeInteger(data.total_count) || data.total_count < 1 || data.total_count > 100 ||
                    !Array.isArray(data.jobs) || data.jobs.length !== data.total_count) {
                  throw new Error('Workflow attempt job list is incomplete.');
                }
                const names = new Set();
                for (const job of data.jobs) {
                  if (!job || !Number.isSafeInteger(job.id) || job.id < 1 || seenIds.has(job.id) ||
                      job.run_id !== run.id || job.head_sha !== run.head ||
                      (job.run_attempt !== undefined && job.run_attempt !== attempt) ||
                      typeof job.name !== 'string' || names.has(job.name)) {
                    throw new Error('Workflow job identity or attempt is incomplete.');
                  }
                  seenIds.add(job.id);
                  names.add(job.name);
                  latest.set(job.name, { job, attempt });
                }
              }
              const evidence = [];
              for (const name of required) {
                const selected = latest.get(name);
                const job = selected?.job;
                if (!job || job.status !== 'completed' || job.conclusion !== 'success') {
                  throw new Error('Required job did not succeed: ' + name);
                }
                const prefix = 'https://api.github.com/repos/' + fullName + '/check-runs/';
                const suffix = typeof job.check_run_url === 'string' && job.check_run_url.startsWith(prefix)
                  ? job.check_run_url.slice(prefix.length) : '';
                const checkId = Number(suffix);
                if (!/^[1-9][0-9]*$/.test(suffix) || !Number.isSafeInteger(checkId)) {
                  throw new Error('Required job has no valid check-run identity: ' + name);
                }
                const check = (await github.rest.checks.get({ owner, repo, check_run_id: checkId })).data;
                if (!check || check.id !== checkId || check.name !== name || check.head_sha !== run.head ||
                    check.status !== 'completed' || check.conclusion !== 'success' || check.app?.id !== 15368) {
                  throw new Error('Required job does not have the expected GitHub Actions check: ' + name);
                }
                evidence.push({ name, jobId: job.id, checkId, attempt: selected.attempt });
              }
              return evidence;
            };
            const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: baseName, per_page: 100 });
            if (!Array.isArray(open) || open.length > 1000) throw new Error('Open PR listing is incomplete.');
            const candidates = open.filter((pr) => isBot(pr?.user) && typeof pr.head?.ref === 'string' &&
              branchPattern.test(pr.head.ref) && pr.head?.repo?.full_name === fullName);
            if (candidates.length === 0) {
              core.info('No open App health PR is eligible.');
              return;
            }
            if (candidates.length !== 1 || !Number.isSafeInteger(candidates[0].number) || candidates[0].number < 1) {
              throw new Error('More than one App health PR is open or its identity is incomplete.');
            }
            const number = candidates[0].number;
            const rulesBefore = await ruleSnapshot();
            const pr = await inspectPr(number);
            const runs = selectRuns(await getRuns(pr.head), pr);
            if (runs.some((run) => run === null)) {
              core.info('Waiting for the latest CI and Python matrix runs.');
              return;
            }
            const contextName = 'dependabot-context-' + pr.head + '-' + pr.head + '-' + pr.head;
            const ciJobs = [
              contextName, 'Required CI', 'version-consistency', 'auto-format-guard', 'release-input-guard',
              'lint', 'python-tests', 'frontend-check', 'rust-check',
            ];
            const matrixJobs = [contextName, 'Required Python matrix'];
            for (const os of ['ubuntu-22.04', 'macos-15', 'windows-latest']) {
              for (const version of ['3.10', '3.11', '3.12', '3.13', '3.14']) {
                matrixJobs.push('python-tests (' + os + ', ' + version + ')');
              }
            }
            const evidence = await Promise.all([
              successfulJobs(runs[0], ciJobs), successfulJobs(runs[1], matrixJobs),
            ]);
            const rulesAfter = await ruleSnapshot();
            const current = await inspectPr(number);
            const latest = selectRuns(await getRuns(pr.head), current);
            if (rulesBefore.snapshot !== rulesAfter.snapshot || rulesBefore.nodeId !== rulesAfter.nodeId ||
                JSON.stringify(pr) !== JSON.stringify(current) ||
                JSON.stringify(runs) !== JSON.stringify(latest)) {
              throw new Error('Rules, PR context, report, or latest test run changed before merge.');
            }
            const evidenceAgain = await Promise.all([
              successfulJobs(latest[0], ciJobs), successfulJobs(latest[1], matrixJobs),
            ]);
            if (JSON.stringify(evidence) !== JSON.stringify(evidenceAgain)) {
              throw new Error('Required job or check evidence changed before the update.');
            }
            const rulesFinal = await ruleSnapshot();
            const finalPr = await inspectPr(number);
            const finalRuns = selectRuns(await getRuns(pr.head), finalPr);
            if (rulesBefore.snapshot !== rulesFinal.snapshot || rulesBefore.nodeId !== rulesFinal.nodeId ||
                JSON.stringify(pr) !== JSON.stringify(finalPr) || JSON.stringify(runs) !== JSON.stringify(finalRuns)) {
              throw new Error('Rules, PR context, report, or runs changed immediately before the update.');
            }
            // The expected base and destination are evaluated atomically by GitHub.
            const result = await app.graphql(
              'mutation($input: UpdateRefsInput!) { updateRefs(input: $input) { clientMutationId } }',
              { input: { repositoryId: rulesBefore.nodeId, clientMutationId: 'health-' + pr.number + '-' + pr.head,
                refUpdates: [{ name: 'refs/heads/Source_Code', beforeOid: pr.base, afterOid: pr.head, force: false }] } },
            );
            if (result?.updateRefs?.clientMutationId !== 'health-' + pr.number + '-' + pr.head ||
                await getRef(baseName) !== pr.head) {
              throw new Error('GitHub did not confirm the exact Source_Code ref update.');
            }
            core.notice('Updated Source_Code to verified App health commit ' + pr.head + ' from PR #' + number + '.');
