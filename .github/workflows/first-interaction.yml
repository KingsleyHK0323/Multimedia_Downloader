# OpenAI-Codex: welcome first-time contributors without checking out PR code.
name: First interaction

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Thank you for opening your first issue! We appreciate the report and will review it."
          pr-message: "Thank you for your first pull request! We appreciate your contribution and will review it."
