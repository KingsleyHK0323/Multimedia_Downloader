# OpenAI-Codex: welcome a person's first repository contribution without executing PR code.
# OpenAI-Codex_ruleset_architecture: reconcile fork PR metadata from trusted workflow code.
name: First interaction

on:
  issues:
    types: [opened]
  workflow_run:
    workflows: [CI, Website build check]
    types: [completed]
  schedule:
    - cron: '13 */2 * * *'
  workflow_dispatch:
    inputs:
      item_number:
        description: Issue or pull request number to preview without posting
        required: true
        type: string

permissions:
  issues: write
  pull-requests: write

# OpenAI-Codex_ruleset_architecture: serialize each issue separately and all PR scans together.
concurrency:
  group: first-interaction-${{ github.event_name == 'issues' && format('issue-{0}', github.event.issue.number) || 'pr-scan' }}
  cancel-in-progress: false

jobs:
  welcome:
    if: >-
      github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Welcome a first-time contributor
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_ITEM: ${{ inputs.item_number }}
        with:
          script: |
            // OpenAI-Codex_ruleset_architecture: wake from trusted workflow code and inspect PR metadata only.
            const { owner, repo } = context.repo;
            const scanOpenPulls = async () => {
              const all = [];
              const numbers = new Set();
              for (let page = 1; page <= 10; page++) {
                const rows = (await github.rest.pulls.list({
                  owner, repo, state: 'open', sort: 'created', direction: 'asc',
                  per_page: 100, page,
                })).data;
                if (!Array.isArray(rows) || rows.length > 100) throw new Error('Open PR inventory is incomplete.');
                for (const pr of rows) {
                  if (!Number.isSafeInteger(pr?.number) || pr.number < 1 || numbers.has(pr.number) ||
                      typeof pr.base?.ref !== 'string' || !pr.base.ref ||
                      pr.base?.repo?.id !== 1251103365 || pr.base.repo.full_name !== owner + '/' + repo) {
                    throw new Error('Open PR inventory is inconsistent.');
                  }
                  numbers.add(pr.number);
                  all.push(pr);
                }
                if (rows.length < 100) return all;
              }
              throw new Error('Open PR inventory reached the safe scan limit.');
            };
            const welcome = async (item, isIssue, preview, requireSender) => {
            const sender = context.payload.sender;
            if (!item || !Number.isSafeInteger(item.number) || item.number < 1 || item.state !== 'open' ||
                item.user?.type !== 'User' || !Number.isSafeInteger(item.user?.id) || item.user.id < 1 ||
                typeof item.user?.login !== 'string' || !item.user.login.trim() ||
                (!preview && requireSender && (sender?.type !== 'User' || sender.id !== item.user.id))) {
              core.notice('First interaction has incomplete or non-human identity; skipped.');
              return;
            }
            const history = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, creator: item.user.login, state: 'all', per_page: 100,
            });
            if (!Array.isArray(history) || history.some(entry => !Number.isSafeInteger(entry?.number) ||
                entry.number < 1 || !Number.isSafeInteger(entry.user?.id))) {
              throw new Error('Incomplete contributor history');
            }
            if (!history.some(entry => entry.number === item.number && entry.user.id === item.user.id)) {
              core.warning('Current contribution is not present in the history; skipped.');
              return;
            }
            if (history.some(entry => entry.number < item.number && entry.user.id === item.user.id)) {
              core.info('Earlier contribution found; no welcome.');
              return;
            }
            const marker = '<!-- multimedia-downloader:first-contribution -->';
            const legacy = isIssue
              ? 'Thank you for opening your first issue! We appreciate the report and will review it.'
              : 'Thank you for your first pull request! We appreciate your contribution and will review it.';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: item.number, per_page: 100,
            });
            if (!Array.isArray(comments)) throw new Error('Incomplete comment inventory');
            if (comments.some(comment => comment.user?.login === 'github-actions[bot]' &&
                typeof comment.body === 'string' && (comment.body.includes(marker) || comment.body === legacy))) {
              core.info('This contribution was already welcomed.');
              return;
            }
            // OpenAI-Codex: re-read the target immediately before writing.
            const latest = (await github.rest.issues.get({ owner, repo, issue_number: item.number })).data;
            if (latest?.state !== 'open' || latest.number !== item.number || latest.user?.id !== item.user.id ||
                Boolean(latest.pull_request) === isIssue) return;
            if (preview) {
              core.info('Preview only: this first contribution would receive a welcome; no comment was posted.');
              return;
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: item.number,
              body: legacy + '\n\n' + marker });

            };
            if (context.eventName === 'workflow_dispatch') {
              const input = process.env.PREVIEW_ITEM || '';
              if (!/^[1-9][0-9]{0,9}$/.test(input)) throw new Error('Invalid preview item number');
              const item = (await github.rest.issues.get({ owner, repo, issue_number: Number(input) })).data;
              await welcome(item, !item?.pull_request, true, false);
            } else if (context.eventName === 'issues') {
              if (context.payload.action !== 'opened') return;
              await welcome(context.payload.issue, true, false, true);
            } else if (context.eventName === 'schedule' ||
                       (context.eventName === 'workflow_run' && context.payload.workflow_run?.event === 'pull_request')) {
              const pulls = await scanOpenPulls();
              let failures = 0;
              for (const pr of pulls) {
                try { await welcome(pr, false, false, false); }
                catch { failures++; core.warning('A PR welcome could not be evaluated; the next scan will retry.'); }
              }
              if (failures) throw new Error('One or more PR welcomes could not be evaluated.');
            }
