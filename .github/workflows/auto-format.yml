# OpenAI-Codex: format only Python files changed in the push.
name: Auto-format Python

on:
  push:
    branches: [Source_Code]

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    # OpenAI-Codex_format_architecture: keep legacy as the default until App CAS is enabled.
    if: >-
      (vars.AUTOMATION_FORMAT_MODE == '' || vars.AUTOMATION_FORMAT_MODE == 'legacy') &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # OpenAI-Codex_format_architecture: isolate Python from checkout-local modules.
      - name: Install pinned formatter
        run: python -I -m pip install black==25.1.0
      - name: Format changed Python files
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          python -I - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          before = os.environ["BEFORE_SHA"]
          head = os.environ["PUSH_SHA"]
          if before == "0" * 40:
              raise SystemExit("Cannot safely format a push without a base commit.")
          subprocess.run(["git", "merge-base", "--is-ancestor", before, head], check=True)
          changed = subprocess.check_output([
              "git", "diff", "--name-only", "-z", "--diff-filter=ACMR",
              before, head, "--", "*.py",
          ]).split(b"\0")
          # OpenAI-Codex: do not follow changed symlinks outside the checkout.
          files = [os.fsdecode(path) for path in changed if path
                   and not Path(os.fsdecode(path)).is_symlink()
                   and Path(os.fsdecode(path)).is_file()]
          for offset in range(0, len(files), 50):
              group = files[offset:offset + 50]
              subprocess.run(["python", "-I", "-m", "black", "--", *group], check=True)
              subprocess.run(["git", "add", "--", *group], check=True)
          PY
      - name: Commit and request CI
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format changed Python files"
          git push origin "HEAD:refs/heads/Source_Code"
          # OpenAI-Codex: GITHUB_TOKEN commits do not trigger push workflows.
          gh workflow run ci.yml --ref Source_Code
          gh workflow run python-matrix.yml --ref Source_Code
          gh workflow run cross-branch-checks.yml --ref Source_Code
          gh workflow run container.yml --ref Source_Code
          gh workflow run api-docs.yml --ref Source_Code
