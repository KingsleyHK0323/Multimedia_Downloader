        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          # OpenAI-Codex: use the supported App client ID input.
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Reconcile the fixed version PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        with:
          script: |
            // OpenAI-Codex_health_release_architecture: the App-token job uses only this trusted inline program.
            const { createHash } = require('node:crypto');
