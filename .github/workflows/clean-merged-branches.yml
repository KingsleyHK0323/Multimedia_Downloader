# OpenAI-Codex: preserve both permanent branches when cleaning merged heads.
name: Clean merged branches

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Merged pull request number'
        required: true
        type: string
      dry_run:
        description: 'Inspect cleanup without deleting a branch'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete unchanged merged branch
        uses: actions/github-script@v8
        env:
          MANUAL_PR: ${{ inputs.pr_number }}
          DRY_RUN: ${{ inputs.dry_run }}
          CLEANUP_TOKEN: ${{ github.token }}
        with:
          script: |
            const { owner, repo } = context.repo;
            let pr = context.payload.pull_request;
            if (context.eventName === 'workflow_dispatch') {
              if (!/^[1-9][0-9]{0,9}$/.test(process.env.MANUAL_PR)) throw new Error('Invalid PR number');
              pr = (await github.rest.pulls.get({ owner, repo, pull_number: Number(process.env.MANUAL_PR) })).data;
            }
            if (!pr || !pr.merged) throw new Error('PR is not merged');
            const branch = pr.head.ref;
            if (!pr.head.repo || pr.head.repo.full_name !== context.payload.repository.full_name) {
              core.info('External fork; no branch will be deleted.');
              return;
            }
            if (['Source_Code', 'Multimedia_Downloader_Web_Preview'].includes(branch)) {
              core.info('Permanent project branch; no deletion.');
              return;
            }
            let ref;
            try {
              ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status === 404) {
                core.info('Branch already absent.');
                return;
              }
              throw error;
            }
            if (ref.data.object.sha !== pr.head.sha) {
              core.warning('Branch advanced after merge; preserving it.');
              return;
            }
            // OpenAI-Codex: manual verification defaults to preserving the branch.
            if (context.eventName === 'workflow_dispatch' && process.env.DRY_RUN !== 'false') {
              core.info('Dry run: eligible branch will be preserved.');
              return;
            }
            // OpenAI-Codex: Git's lease makes the deletion conditional at the server.
            if (!/^[0-9a-f]{40}$/.test(pr.head.sha) ||
                !/^[A-Za-z0-9_.-]+$/.test(owner) || !/^[A-Za-z0-9_.-]+$/.test(repo) ||
                typeof branch !== 'string' || !process.env.CLEANUP_TOKEN) {
              throw new Error('Invalid cleanup identity or missing token');
            }
            const { execFileSync } = require('node:child_process');
            const fs = require('node:fs');
            const os = require('node:os');
            const path = require('node:path');
            const refName = `refs/heads/${branch}`;
            execFileSync('git', ['check-ref-format', refName], { stdio: 'ignore' });
            const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'branch-cleanup-'));
            execFileSync('git', ['init', '--bare', dir], { stdio: 'ignore' });
            const auth = Buffer.from(`x-access-token:${process.env.CLEANUP_TOKEN}`).toString('base64');
            const env = { ...process.env, GIT_TERMINAL_PROMPT: '0', GIT_CONFIG_COUNT: '1',
              GIT_CONFIG_KEY_0: 'http.https://github.com/.extraheader',
              GIT_CONFIG_VALUE_0: `AUTHORIZATION: basic ${auth}` };
            try {
              execFileSync('git', ['-C', dir, 'push',
                `--force-with-lease=${refName}:${pr.head.sha}`,
                `https://github.com/${owner}/${repo}.git`, `:${refName}`],
                { env, stdio: 'pipe' });
            } catch {
              throw new Error('Conditional branch deletion failed; branch may have changed');
            }
