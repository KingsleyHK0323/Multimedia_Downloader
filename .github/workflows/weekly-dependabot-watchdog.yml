name: Weekly Dependabot Watchdog
# OpenAI-Codex: pin actions/github-script v9.0.0 to its release commit.

on:
  schedule:
    # Tuesday 20:15 Hong Kong time, after the weekly update window.
    - cron: "15 12 * * 2"
  workflow_dispatch:
    inputs:
      preview:
        description: Preview findings without modifying issues
        type: boolean
        default: false

permissions:
  actions: read
  issues: write
  pull-requests: read
  vulnerability-alerts: read

concurrency:
  group: weekly-dependabot-watchdog
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check Dependabot scans and open pull requests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = "<!-- weekly-dependabot-watchdog -->";
            const maxAgeMs = 8 * 24 * 60 * 60 * 1000;
            const findings = [];
            const expectedScans = [
              ["root npm", "npm_and_yarn in / - Update #"],
              ["frontend npm", "npm_and_yarn in /frontend - Update #"],
              ["root pip", "pip in / - Update #"],
              ["engine pip", "pip in /engine - Update #"],
              ["Cargo", "cargo in /src-tauri - Update #"],
              ["GitHub Actions", "github_actions in / - Update #"],
            ];

            const updateRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                branch: "Source_Code",
                event: "dynamic",
                per_page: 100,
              },
            );
            const dependabotRuns = updateRuns.filter(
              (run) => run.path?.startsWith("dynamic/dependabot/"),
            );

            // OpenAI-Codex: recognize GitHub's root directory alias without modifying API data.
            for (const run of dependabotRuns.slice()) {
              if (typeof run.name === "string" &&
                  /^(npm_and_yarn|pip|github_actions) in \/\.( - Update #[0-9]+)$/.test(run.name)) {
                dependabotRuns.push({ ...run, name: run.name.replace(" in /. - Update #", " in / - Update #") });
              }
            }

            for (const [label, prefix] of expectedScans) {
              const matching = dependabotRuns
                .filter((run) => run.name?.startsWith(prefix))
                .sort(
                  (a, b) => Date.parse(b.created_at) - Date.parse(a.created_at),
                );
              const latest = matching[0];
              if (!latest) {
                findings.push(
                  `Could not confirm a recent Dependabot scan for ${label}; no matching update run was found. Check the Dependabot run naming if GitHub changed it.`,
                );
                continue;
              }

              if (Date.now() - Date.parse(latest.created_at) > maxAgeMs) {
                findings.push(
                  `The ${label} Dependabot scan is stale: [run #${latest.run_number}](${latest.html_url}), created ${latest.created_at}.`,
                );
              }
              if (latest.status !== "completed") {
                findings.push(
                  `The ${label} Dependabot scan has status \`${latest.status}\`: [run #${latest.run_number}](${latest.html_url}).`,
                );
              } else if (latest.conclusion !== "success") {
                findings.push(
                  `The ${label} Dependabot scan concluded \`${latest.conclusion}\`: [run #${latest.run_number}](${latest.html_url}).`,
                );
              }
            }

            // OpenAI-Codex: report failed security updates while related alerts remain open.
            const openAlerts = await github.paginate(github.rest.dependabot.listAlertsForRepo, {
              owner, repo, state: "open", per_page: 100,
            });
            if (!Array.isArray(openAlerts)) throw new Error("Cannot verify Dependabot alert state.");
            const ecosystemNames = { npm: "npm_and_yarn", pip: "pip", rust: "cargo" };
            // OpenAI-Codex: correlate update attempts with each alert's manifest directory.
            const openTargets = new Set();
            const packageKey = (ecosystem, name) => ecosystem + "\0" +
              (ecosystem === "pip" ? name.toLowerCase().replace(/[-_.]+/g, "-") : name.toLowerCase());
            const manifestDirectory = (manifest) => {
              if (typeof manifest !== "string" || !manifest || manifest.length > 1024 ||
                  manifest.startsWith("/") || manifest.includes("\\") || manifest.includes("\0")) return null;
              const parts = manifest.split("/");
              if (parts.some((part) => !part || part === "." || part === "..")) return null;
              parts.pop();
              return "/" + parts.join("/");
            };
            let incompleteAlert = false;
            for (const alert of openAlerts) {
              const pkg = alert?.dependency?.package;
              const directory = manifestDirectory(alert?.dependency?.manifest_path);
              if (typeof pkg?.name !== "string" || !pkg.name || pkg.name.includes("\0") ||
                  typeof pkg.ecosystem !== "string" || !pkg.ecosystem || pkg.ecosystem.includes("\0") ||
                  directory === null) {
                incompleteAlert = true;
                continue;
              }
              openTargets.add(directory + "\0" + packageKey(ecosystemNames[pkg.ecosystem] || pkg.ecosystem, pkg.name));
            }
            const securityRuns = new Map();
            for (const run of dependabotRuns) {
              if (typeof run.name !== "string") continue;
              const match = /^([a-z_]+) in (\/.*?) for (.+) - Update #[0-9]+$/.exec(run.name);
              if (!match) continue;
              const time = Date.parse(run.created_at);
              if (!Number.isFinite(time) || !Number.isSafeInteger(run.id) || !Number.isSafeInteger(run.run_number)) {
                throw new Error("Cannot safely order Dependabot security update runs.");
              }
              const key = (match[2] === "/." ? "/" : match[2]) + "\0" + packageKey(match[1], match[3]);
              const previous = securityRuns.get(key);
              if (!previous || time > previous.time || (time === previous.time && run.id > previous.run.id)) {
                securityRuns.set(key, { run, time });
              }
            }
            if (incompleteAlert) findings.push("Could not correlate at least one open Dependabot alert with update attempts.");
            const attempted = new Set();
            for (const [key, { run }] of securityRuns) {
              if (!openTargets.has(key)) continue;
              attempted.add(key);
              if (run.status !== "completed" || run.conclusion !== "success") {
                const url = "https://github.com/" + owner + "/" + repo + "/actions/runs/" + run.id;
                findings.push("A security update for an open alert did not succeed: [run #" + run.run_number + "](" + url + ").");
              }
            }
            if ([...openTargets].some((key) => !attempted.has(key))) {
              findings.push("At least one open Dependabot alert has no matching security-update attempt. Review the alert and current update configuration.");
            }

            // OpenAI-Codex: a successful update attempt does not resolve an open alert.
            if (openAlerts.length > 0) {
              findings.push("Dependabot maintenance is not fully verified; review current update activity.");
            }

            const pullRequests = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: "open", base: "Source_Code", per_page: 100 },
            );
            const dependabotPullRequests = pullRequests.filter(
              (pullRequest) => pullRequest.user?.login === "dependabot[bot]",
            );

            for (const pullRequest of dependabotPullRequests) {
              let { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                head_sha: pullRequest.head.sha,
                event: "pull_request",
                per_page: 100,
              });
              let ciRuns = data.workflow_runs
                .filter((run) => run.name === "CI")
                .sort(
                  (a, b) => Date.parse(b.created_at) - Date.parse(a.created_at),
                );

              // Pull-request workflow runs can use GitHub's merge-ref SHA,
              // which differs from the PR head SHA. Fall back to its branch.
              if (ciRuns.length === 0) {
                ({ data } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner,
                  repo,
                  branch: pullRequest.head.ref,
                  event: "pull_request",
                  per_page: 100,
                }));
                ciRuns = data.workflow_runs
                  .filter(
                    (run) =>
                      run.name === "CI" &&
                      run.head_branch === pullRequest.head.ref,
                  )
                  .sort(
                    (a, b) =>
                      Date.parse(b.created_at) - Date.parse(a.created_at),
                  );
              }
              const latest = ciRuns[0];

              if (!latest) {
                findings.push(
                  `Dependabot PR [#${pullRequest.number}](${pullRequest.html_url}) has no CI run for its current head commit.`,
                );
              } else if (latest.status !== "completed") {
                findings.push(
                  `CI for Dependabot PR [#${pullRequest.number}](${pullRequest.html_url}) is \`${latest.status}\`: [run #${latest.run_number}](${latest.html_url}).`,
                );
              } else if (latest.conclusion !== "success") {
                findings.push(
                  `CI for Dependabot PR [#${pullRequest.number}](${pullRequest.html_url}) concluded \`${latest.conclusion}\`: [run #${latest.run_number}](${latest.html_url}).`,
                );
              }
            }

            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: "open", per_page: 100 },
            );
            const issue = openIssues.find(
              (item) =>
                !item.pull_request &&
                item.user?.login === "github-actions[bot]" &&
                item.body?.includes(marker),
            );

            if (findings.length === 0) {
              await core.summary
                .addHeading("Weekly Dependabot watchdog")
                .addRaw(
                  `All six update scans succeeded; CI is current for ${dependabotPullRequests.length} open Dependabot pull request(s).`,
                )
                .write();
              return;
            }

            // OpenAI-Codex: preview real findings without creating or changing issues.
            if (context.eventName === "workflow_dispatch" && context.payload?.inputs?.preview === "true") {
              await core.summary.addHeading("Dependabot watchdog preview").addList(findings).write();
              return;
            }

            const body = [
              marker,
              "## Dependabot watchdog detected an issue",
              "",
              `Checked at ${new Date().toISOString()}.`,
              "",
              ...findings.map((finding) => `- ${finding}`),
              "",
              "This issue is updated by the weekly Dependabot watchdog. The workflow does not change dependencies, merge pull requests, or close this issue automatically.",
            ].join("\n");
            const title = "[Automation] Dependabot maintenance needs attention";

            if (issue) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                title,
                body,
              });
              core.warning(`Updated watchdog issue #${issue.number}.`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
              core.warning(`Created watchdog issue ${created.html_url}.`);
            }

