# OpenAI-Codex_health_release_architecture: preserve legacy mode until the coordinated PR cutover.
# OpenAI-Codex: persist the latest scheduled CI health without generating noise.
name: Update automation health
on:
  push:
    branches: [Source_Code]
  workflow_run:
    workflows: [CI, Python matrix tests]
    types: [completed]
  schedule:
    - cron: "25 13 * * 2"
    - cron: "37 */6 * * *"
  workflow_dispatch:
permissions:
  actions: read
  contents: write
  pull-requests: read
jobs:
  invalid-mode:
    if: vars.AUTOMATION_PR_MODE != '' && vars.AUTOMATION_PR_MODE != 'legacy' && vars.AUTOMATION_PR_MODE != 'enabled'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Reject an unknown automation mode
        run: |
          echo '::error::AUTOMATION_PR_MODE must be empty, legacy, or enabled.'
          exit 1
  legacy-report:
    if: >-
      (vars.AUTOMATION_PR_MODE == '' || vars.AUTOMATION_PR_MODE == 'legacy') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && github.event.schedule == '25 13 * * 2'))
    concurrency:
      group: automation-health-report
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact source ref
        env:
          ACTUAL_REF: ${{ github.ref }}
        shell: bash
        run: |
          [[ "$ACTUAL_REF" == 'refs/heads/Source_Code' ]] ||
            { echo '::error::Unexpected source ref.'; exit 1; }
      - name: Update report when scheduled CI changes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // OpenAI-Codex: write only a deterministic, public CI run summary.
            const { owner, repo } = context.repo;
            const branch = 'Source_Code';
            const path = '.github/automation/ci-health.json';
            const response = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ci.yml', branch, event: 'schedule', per_page: 1,
            });
            const run = response.data?.workflow_runs?.[0];
            if (!run || !Number.isSafeInteger(run.id) || run.id < 1 ||
                !Number.isSafeInteger(run.run_attempt) || run.run_attempt < 1 ||
                typeof run.status !== 'string' || typeof run.html_url !== 'string') {
              core.notice('No usable scheduled CI run; report unchanged.');
              return;
            }
            const report = JSON.stringify({
              generated_by: 'OpenAI-Codex',
              workflow: 'ci.yml',
              event: 'schedule',
              branch,
              run_id: run.id,
              run_attempt: run.run_attempt,
              status: run.status,
              conclusion: run.conclusion ?? null,
              url: run.html_url,
            }, null, 2) + '\n';
            let existing;
            try {
              existing = (await github.rest.repos.getContent({ owner, repo, path, ref: branch })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing && (existing.type !== 'file' || existing.encoding !== 'base64' || typeof existing.sha !== 'string')) {
              throw new Error('Existing report cannot be safely read.');
            }
            if (existing && Buffer.from(existing.content, 'base64').toString('utf8') === report) {
              core.info('CI health report unchanged.');
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: 'chore: update scheduled CI health report',
              content: Buffer.from(report).toString('base64'),
              ...(existing ? { sha: existing.sha } : {}),
            });

  report:
    if: >-
      github.repository == 'KingsleyHK0323/Multimedia_Downloader' &&
      github.ref == 'refs/heads/Source_Code' &&
      vars.AUTOMATION_PR_MODE == 'enabled' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.repository.full_name == github.repository &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        ((github.event.workflow_run.head_branch == 'Source_Code' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')) ||
         (github.event.workflow_run.head_branch == 'automation/protected-workflows' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request')))))
    concurrency:
      group: automation-service-reconcile
      queue: max
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact source ref
        env:
          ACTUAL_REF: ${{ github.ref }}
        shell: bash
        run: |
          [[ "$ACTUAL_REF" == 'refs/heads/Source_Code' ]] ||
            { echo '::error::Unexpected source ref.'; exit 1; }
      # OpenAI-Codex_health_release_architecture: reject a queued workflow from an obsolete source revision.
      - name: Verify current health writer revision
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        shell: bash
        run: |
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid workflow revision.'; exit 1; }
          source_sha="$(gh api 'repos/KingsleyHK0323/Multimedia_Downloader/git/ref/heads/Source_Code' --jq '.object.sha')"
          [[ "$source_sha" == "$WORKFLOW_SHA" ]] || { echo '::error::The health writer revision is stale.'; exit 1; }
      - name: Create a repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          # OpenAI-Codex: use the supported App client ID input.
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Propose a scheduled CI health report
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        with:
          script: |
            // OpenAI-Codex_health_release_architecture: propose one checked health report on the approved temporary branch.
            const { owner, repo } = context.repo;
            const full = 'KingsleyHK0323/Multimedia_Downloader';
            const repoId = 1251103365;
            const base = 'Source_Code';
            const branch = 'automation/protected-workflows';
            const path = '.github/automation/ci-health.json';
            const botId = 359694872;
            const botLogin = 'kingsley-multimedia-automation[bot]';
            const oid = (value) => typeof value === 'string' && /^[0-9a-f]{40}$/.test(value);
            const positive = (value) => Number.isSafeInteger(value) && value > 0;
            const isBot = (user) => user?.id === botId && user.login === botLogin && user.type === 'Bot';
            if (owner + '/' + repo !== full || context.ref !== 'refs/heads/' + base ||
                !process.env.APP_TOKEN || process.env.APP_SLUG !== 'kingsley-multimedia-automation' ||
                !oid(process.env.WORKFLOW_SHA) ||
                !/^[1-9][0-9]*$/.test(process.env.GITHUB_RUN_ID || '') ||
                !/^[1-9][0-9]*$/.test(process.env.GITHUB_RUN_ATTEMPT || '')) {
              throw new Error('Unexpected repository, ref, App, or writer run identity.');
            }
            const app = getOctokit(process.env.APP_TOKEN);
            const crypto = require('node:crypto');
            const blobSha = (bytes) => crypto.createHash('sha1').update('blob ' + bytes.length + '\0').update(bytes).digest('hex');
            const appInfo = (await app.request('GET /apps/{app_slug}', { app_slug: process.env.APP_SLUG })).data;
            const repository = (await app.rest.repos.get({ owner, repo })).data;
            const bot = (await app.rest.users.getByUsername({ username: botLogin })).data;
            if (!appInfo || appInfo.id !== 5868451 || appInfo.slug !== process.env.APP_SLUG ||
                !repository || repository.id !== repoId || repository.full_name !== full || !isBot(bot)) {
              throw new Error('Repository or App identity cannot be verified.');
            }
            const getRef = async (name, allowMissing = false) => {
              if (![base, branch].includes(name)) throw new Error('Unexpected branch requested.');
              try {
                const value = (await github.rest.git.getRef({ owner, repo, ref: 'heads/' + name })).data;
                if (!value || value.ref !== 'refs/heads/' + name || value.object?.type !== 'commit' || !oid(value.object.sha)) {
                  throw new Error('Branch identity is incomplete.');
                }
                return value.object.sha;
              } catch (error) {
                if (allowMissing && error.status === 404) return null;
                throw error;
              }
            };
            const getCommit = async (sha) => {
              const value = (await github.rest.git.getCommit({ owner, repo, commit_sha: sha })).data;
              if (!value || value.sha !== sha || !oid(value.tree?.sha) || !Array.isArray(value.parents) ||
                  value.parents.some((parent) => !oid(parent?.sha))) throw new Error('Commit metadata is incomplete.');
              return value;
            };
            const fullTree = async (sha) => {
              const value = (await github.rest.git.getTree({ owner, repo, tree_sha: sha, recursive: 'true' })).data;
              if (!value || value.sha !== sha || value.truncated !== false || !Array.isArray(value.tree)) {
                throw new Error('Full Git tree is unavailable.');
              }
              const result = new Map();
              for (const entry of value.tree) {
                if (!entry || typeof entry.path !== 'string' || !entry.path || !oid(entry.sha) ||
                    !['blob', 'tree', 'commit'].includes(entry.type) ||
                    typeof entry.mode !== 'string' || result.has(entry.path)) throw new Error('Git tree entry is invalid.');
                result.set(entry.path, entry);
              }
              return result;
            };
            const readReport = async (ref, expectedSha) => {
              const data = (await github.rest.repos.getContent({ owner, repo, path, ref })).data;
              if (!data || data.type !== 'file' || data.encoding !== 'base64' ||
                  typeof data.content !== 'string' || !oid(data.sha) || data.sha !== expectedSha) {
                throw new Error('Report content is incomplete.');
              }
              const encoded = data.content.replace(/\s/g, '');
              if (!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encoded)) {
                throw new Error('Report is not valid base64.');
              }
              const bytes = Buffer.from(encoded, 'base64');
              if (bytes.toString('base64') !== encoded || blobSha(bytes) !== expectedSha) {
                throw new Error('Report blob identity is invalid.');
              }
              return bytes;
            };
            const runs = (await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ci.yml', branch: base, event: 'schedule', per_page: 1,
            })).data;
            if (!runs || !Number.isSafeInteger(runs.total_count) || runs.total_count < 0 ||
                !Array.isArray(runs.workflow_runs) || runs.workflow_runs.length !== Math.min(runs.total_count, 1)) {
              throw new Error('Scheduled CI run inventory is incomplete.');
            }
            if (runs.total_count === 0) { core.notice('No scheduled CI run is available.'); return; }
            const run = runs.workflow_runs[0];
            if (!run || !positive(run.id) || !positive(run.run_attempt) || run.path !== '.github/workflows/ci.yml' ||
                run.event !== 'schedule' || run.head_branch !== base || run.repository?.id !== repoId ||
                run.head_repository?.id !== repoId || typeof run.status !== 'string' ||
                typeof run.created_at !== 'string' || !Number.isFinite(Date.parse(run.created_at)) ||
                run.html_url !== 'https://github.com/' + full + '/actions/runs/' + run.id) {
              throw new Error('Scheduled CI run metadata is incomplete.');
            }
            if (run.status !== 'completed') { core.info('Latest scheduled CI is not complete yet.'); return; }
            const conclusions = new Set(['success', 'failure', 'neutral', 'cancelled', 'skipped', 'timed_out', 'action_required', 'startup_failure', 'stale']);
            if (!conclusions.has(run.conclusion)) throw new Error('Scheduled CI conclusion is invalid.');
            const reportBytes = Buffer.from(JSON.stringify({
              generated_by: 'OpenAI-Codex', workflow: 'ci.yml', event: 'schedule', branch: base,
              run_id: run.id, run_attempt: run.run_attempt, status: run.status, conclusion: run.conclusion, url: run.html_url,
            }, null, 2) + '\n', 'utf8');
            const reportBlob = blobSha(reportBytes);
            const baseSha = await getRef(base);
            if (baseSha !== process.env.WORKFLOW_SHA) throw new Error('Health writer revision is stale.');
            const baseCommit = await getCommit(baseSha);
            const baseTree = await fullTree(baseCommit.tree.sha);
            for (const name of ['.github', '.github/automation']) {
              const entry = baseTree.get(name);
              if (!entry || entry.type !== 'tree' || entry.mode !== '040000') throw new Error('Base report parent is invalid.');
            }
            const baseReport = baseTree.get(path);
            if (!baseReport || baseReport.type !== 'blob' || baseReport.mode !== '100644') {
              throw new Error('Base report entry is invalid.');
            }
            const oldBytes = await readReport(baseSha, baseReport.sha);
            const ensureBase = async () => {
              if (await getRef(base) !== baseSha) throw new Error('Source_Code moved; preserving the temporary branch.');
              const current = (await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'ci.yml', branch: base, event: 'schedule', per_page: 1,
              })).data;
              const latest = current?.workflow_runs?.[0];
              if (!current || !Number.isSafeInteger(current.total_count) || current.total_count < 1 ||
                  !Array.isArray(current.workflow_runs) || current.workflow_runs.length !== 1 ||
                  !latest || latest.id !== run.id || latest.run_attempt !== run.run_attempt ||
                  latest.status !== run.status || latest.conclusion !== run.conclusion ||
                  latest.path !== run.path || latest.event !== run.event || latest.head_branch !== base ||
                  latest.repository?.id !== repoId || latest.head_repository?.id !== repoId ||
                  latest.html_url !== run.html_url) {
                throw new Error('Latest scheduled CI changed; retry reconciliation.');
              }
            };
            const treeMatches = async (treeSha) => {
              const result = await fullTree(treeSha);
              if (result.size !== baseTree.size) throw new Error('Report candidate changed the tree inventory.');
              for (const [name, old] of baseTree) {
                const next = result.get(name);
                if (!next || next.type !== old.type || next.mode !== old.mode) throw new Error('Report candidate changed a tree entry.');
                if (name === path) {
                  if (next.sha !== reportBlob) throw new Error('Report candidate blob is incorrect.');
                } else if (!['.github', '.github/automation'].includes(name) && next.sha !== old.sha) {
                  throw new Error('Report candidate changed an unrelated path.');
                }
              }
            };
            const commitMessage = 'chore: update scheduled CI health report\n\nOpenAI-Codex_health_release_architecture\n' +
              'Health-CI: ' + run.id + '/' + run.run_attempt + '\n' +
              'Writer-Run: ' + process.env.GITHUB_RUN_ID + '/' + process.env.GITHUB_RUN_ATTEMPT;
            const messagePattern = /^chore: update scheduled CI health report\n\nOpenAI-Codex_health_release_architecture\nHealth-CI: ([1-9][0-9]*)\/([1-9][0-9]*)\nWriter-Run: ([1-9][0-9]*)\/([1-9][0-9]*)$/;
            const verifyCandidate = async (head) => {
              const commit = await getCommit(head);
              if (commit.parents.length !== 1 || commit.parents[0].sha !== baseSha) {
                throw new Error('Health candidate base is stale or has unexpected history.');
              }
              const detail = (await github.rest.repos.getCommit({ owner, repo, ref: head })).data;
              const match = typeof detail?.commit?.message === 'string' ? messagePattern.exec(detail.commit.message) : null;
              if (!detail || detail.sha !== head || !isBot(detail.author) ||
                  detail.committer?.id !== 19864447 || detail.committer.login !== 'web-flow' ||
                  detail.commit?.verification?.verified !== true || detail.commit.verification.reason !== 'valid' ||
                  detail.commit?.tree?.sha !== commit.tree.sha || !Array.isArray(detail.parents) ||
                  detail.parents.length !== 1 || detail.parents[0]?.sha !== baseSha || !match ||
                  Number(match[1]) !== run.id || Number(match[2]) !== run.run_attempt ||
                  !positive(Number(match[3])) || !positive(Number(match[4]))) {
                throw new Error('Health commit identity, signature, nonce, or parent is invalid.');
              }
              const writer = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: Number(match[3]) })).data;
              if (!writer || writer.id !== Number(match[3]) || !positive(writer.run_attempt) ||
                  writer.run_attempt < Number(match[4]) || writer.path !== '.github/workflows/automation-health.yml' ||
                  !['push', 'schedule', 'workflow_run', 'workflow_dispatch'].includes(writer.event) ||
                  writer.head_branch !== base || writer.repository?.id !== repoId || writer.head_repository?.id !== repoId) {
                throw new Error('Health commit writer nonce is not a trusted run.');
              }
              await treeMatches(commit.tree.sha);
              const bytes = await readReport(head, reportBlob);
              if (!bytes.equals(reportBytes)) throw new Error('Health candidate report is not current.');
            };
            const validatePr = async (item, head) => {
              if (!item || !positive(item.number) || item.state !== 'open' || !isBot(item.user) ||
                  item.head?.repo?.id !== repoId || item.head.repo.full_name !== full ||
                  item.head.ref !== branch || item.head.sha !== head ||
                  item.base?.repo?.id !== repoId || item.base.repo.full_name !== full ||
                  item.base.ref !== base || item.base.sha !== baseSha ||
                  item.auto_merge !== null || item.draft !== false || !Array.isArray(item.labels) ||
                  item.labels.some((label) => typeof label?.name !== 'string' || label.name.toLowerCase() === 'release:patch') ||
                  item.changed_files !== 1 || item.html_url !== 'https://github.com/' + full + '/pull/' + item.number) {
                throw new Error('Existing temporary-branch PR is not the expected App health PR.');
              }
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: item.number, per_page: 100,
              });
              if (!Array.isArray(files) || files.length !== 1 || files[0]?.filename !== path ||
                  files[0].status !== 'modified' || files[0].sha !== reportBlob || files[0].previous_filename !== undefined) {
                throw new Error('Existing health PR changed an unexpected file.');
              }
            };
            const openSnapshot = async (head) => {
              const heads = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', head: owner + ':' + branch, per_page: 100,
              });
              const bases = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', base: branch, per_page: 100,
              });
              if (!Array.isArray(heads) || heads.length > 100 || !Array.isArray(bases) || bases.length) {
                throw new Error('Temporary branch is used by an unexpected open PR.');
              }
              if (!head) {
                if (heads.length) throw new Error('A PR references the missing temporary branch.');
                return null;
              }
              const result = await github.graphql(
                'query($owner:String!, $repo:String!, $ref:String!) {' +
                ' repository(owner:$owner, name:$repo) { nameWithOwner ref(qualifiedName:$ref) {' +
                ' target { oid } associatedPullRequests(first:100, states:[OPEN]) {' +
                ' totalCount nodes { number state headRefName baseRefName headRepository { nameWithOwner }' +
                ' baseRepository { nameWithOwner } } pageInfo { hasNextPage } } } } }',
                { owner, repo, ref: 'refs/heads/' + branch },
              );
              const ghRef = result?.repository?.ref;
              const association = ghRef?.associatedPullRequests;
              if (result?.repository?.nameWithOwner !== full || ghRef?.target?.oid !== head || !association ||
                  !Number.isSafeInteger(association.totalCount) || association.totalCount < 0 || association.totalCount > 100 ||
                  !Array.isArray(association.nodes) || association.nodes.length !== association.totalCount ||
                  association.pageInfo?.hasNextPage !== false || association.totalCount !== heads.length ||
                  association.nodes.some((item) => !positive(item?.number) || item.state !== 'OPEN' ||
                    item.headRefName !== branch || item.baseRefName !== base ||
                    item.headRepository?.nameWithOwner !== full || item.baseRepository?.nameWithOwner !== full ||
                    !heads.some((headPr) => headPr?.number === item.number))) {
                throw new Error('Temporary branch has unknown or incomplete PR associations.');
              }
              if (heads.length > 1) throw new Error('Temporary branch has multiple open PRs.');
              return heads[0] ?? null;
            };
            const stableOpen = async (head) => {
              const first = await openSnapshot(head);
              const second = await openSnapshot(head);
              const key = (item) => item ? [item.number, item.state, item.user?.id, item.head?.sha,
                item.head?.repo?.id, item.base?.ref, item.base?.sha, item.base?.repo?.id] : null;
              if (JSON.stringify(key(first)) !== JSON.stringify(key(second))) {
                throw new Error('Temporary branch PR inventory changed.');
              }
              return second;
            };
            const refusePreviouslyClosed = async () => {
              let previous = Infinity;
              let complete = false;
              for (let page = 1; page <= 10; page++) {
                const items = (await github.rest.pulls.list({
                  owner, repo, state: 'closed', head: owner + ':' + branch,
                  sort: 'updated', direction: 'desc', per_page: 100, page,
                })).data;
                if (!Array.isArray(items) || items.length > 100) throw new Error('Closed PR history is unavailable.');
                for (const item of items) {
                  const updated = typeof item?.updated_at === 'string' ? Date.parse(item.updated_at) : NaN;
                  if (!Number.isFinite(updated) || updated > previous) throw new Error('Closed PR history ordering is unsafe.');
                  previous = updated;
                  if (updated < Date.parse(run.created_at)) { complete = true; break; }
                  if (item.state !== 'closed' || !isBot(item.user) || item.head?.ref !== branch) continue;
                  if (!positive(item.number) || !oid(item.head.sha) || item.base?.repo?.id !== repoId ||
                      item.base.repo.full_name !== full || item.base.ref !== base ||
                      (item.head.repo !== null && (item.head.repo?.id !== repoId || item.head.repo.full_name !== full)) ||
                      !(item.merged_at === null || typeof item.merged_at === 'string')) {
                    throw new Error('Closed App PR identity is incomplete.');
                  }
                  if (item.merged_at !== null) continue;
                  const oldCommit = await getCommit(item.head.sha);
                  const oldTree = await fullTree(oldCommit.tree.sha);
                  const entry = oldTree.get(path);
                  if (!entry || entry.type !== 'blob' || entry.mode !== '100644') {
                    throw new Error('Closed App PR report cannot be verified.');
                  }
                  const previousBytes = await readReport(item.head.sha, entry.sha);
                  const previousSchema = Buffer.from(JSON.stringify({
                    generated_by: 'OpenAI-Codex', workflow: 'ci.yml', event: 'schedule', branch: base,
                    run_id: run.id, status: run.status, conclusion: run.conclusion, url: run.html_url,
                  }, null, 2) + '\n', 'utf8');
                  if (previousBytes.equals(reportBytes) || previousBytes.equals(previousSchema)) {
                    throw new Error('This report was manually closed; it will not be recreated.');
                  }
                }
                if (complete || items.length < 100) { complete = true; break; }
              }
              if (!complete) throw new Error('Too many recent closed PRs to verify safely.');
            };
            let head = await getRef(branch, true);
            let pr = await stableOpen(head);
            if (head) {
              if (oldBytes.equals(reportBytes)) {
                throw new Error('Health report is current but the temporary branch is in use; preserving it.');
              }
              await refusePreviouslyClosed();
              await verifyCandidate(head);
              if (pr) {
                const detail = (await github.rest.pulls.get({ owner, repo, pull_number: pr.number })).data;
                await validatePr(detail, head);
                await ensureBase();
                if (await getRef(branch) !== head) throw new Error('Temporary branch changed.');
                const current = await stableOpen(head);
                if (!current || current.number !== pr.number || current.head?.sha !== head) {
                  throw new Error('Health PR changed after verification.');
                }
                core.info('The verified App health PR is already current.');
                return;
              }
              await ensureBase();
              if (await getRef(branch) !== head || await stableOpen(head)) {
                throw new Error('Temporary branch changed before orphan recovery.');
              }
            } else {
              if (pr) throw new Error('A PR references the missing temporary branch.');
              if (oldBytes.equals(reportBytes)) { core.info('CI health report unchanged.'); return; }
              await refusePreviouslyClosed();
              await ensureBase();
              if (await getRef(branch, true) !== null || await stableOpen(null)) {
                throw new Error('Temporary branch became occupied.');
              }
              await ensureBase();
              const blob = (await app.rest.git.createBlob({ owner, repo, content: reportBytes.toString('base64'), encoding: 'base64' })).data;
              if (!blob || blob.sha !== reportBlob) throw new Error('Created report blob is invalid.');
              await ensureBase();
              const tree = (await app.rest.git.createTree({
