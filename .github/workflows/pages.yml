name: Build and deploy preview site

on:
  push:
    branches: [Multimedia_Downloader_Web_Preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      # OpenAI-Codex: publish the approved API modules with the website.
      - name: Check out application source for API documentation
        uses: actions/checkout@v6
        with:
          ref: Source_Code
          path: .api-source
      - name: Set up Python for API documentation
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install API documentation dependencies
        run: python -m pip install pdoc==15.0.4 -r .api-source/requirements-web.txt
      - name: Generate API reference
        working-directory: .api-source
        run: python -m pdoc -o ../dist/api engine ai i18n
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
