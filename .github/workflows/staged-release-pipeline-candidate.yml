name: Staged release pipeline candidate

# OpenAI-Codex_safe_scope: draft candidate; protection gate is intentionally fail-closed.
# Build outputs are untrusted until independently verified. FFmpeg downloads,
# pip packages and actions below are not yet fully pinned or authenticated.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate inputs only or build untrusted test artifacts
        required: true
        type: choice
        options: [validate, build]
      source_sha:
        description: Full lowercase commit SHA to build
        required: true
        type: string
      tag:
        description: Expected canonical version tag, for example v4.3.21
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-input:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.validate.outputs.source_sha }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - id: validate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TAG: ${{ inputs.tag }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          (( ${#TAG} <= 51 )) || exit 1
          [[ "$SOURCE_SHA" == "$WORKFLOW_SHA" ]] || { echo "::error::Source must match the dispatched workflow commit."; exit 1; }
          printf 'source_sha=%s\nversion=%s\n' "$SOURCE_SHA" "${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    if: inputs.mode == 'build'
    needs: validate-input
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-input.outputs.source_sha }}
          persist-credentials: false
      - name: Verify checked-out commit
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.validate-input.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify project version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.validate-input.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/check_version_consistency.py
          python -c 'import json,os,sys; sys.exit(json.load(open("package.json", encoding="utf-8"))["version"] != os.environ["EXPECTED_VERSION"])'
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libappindicator3-dev patchelf
      - name: Build Python engine sidecar
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller yt-dlp mutagen brotli certifi requests websockets
          pyinstaller packaging/engine_sidecar.spec --noconfirm --distpath packaging/dist --workpath packaging/build
      - name: Stage ffmpeg on Linux
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 300 -o ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          xz -t ffmpeg.tar.xz
          mkdir ffmpeg-dl
          tar -xf ffmpeg.tar.xz -C ffmpeg-dl
          bin="$(find ffmpeg-dl -name ffmpeg -type f | head -1)"
          test -n "$bin"
          cp "$bin" packaging/dist/engine_sidecar/ffmpeg
          chmod +x packaging/dist/engine_sidecar/ffmpeg
          packaging/dist/engine_sidecar/ffmpeg -version | head -1
      - name: Stage ffmpeg on macOS
        if: matrix.platform == 'macos-15'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          curl -fL --retry 3 --max-time 300 -o ffmpeg.zip https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip
          unzip -tqq ffmpeg.zip
          mkdir ffmpeg-dl
          unzip -oq ffmpeg.zip -d ffmpeg-dl
          bin="$(find ffmpeg-dl -name ffmpeg -type f | head -1)"
          test -n "$bin"
          case " $(lipo -archs "$bin") " in *" arm64 "*) ;; *) exit 1 ;; esac
          cp "$bin" packaging/dist/engine_sidecar/ffmpeg
          chmod +x packaging/dist/engine_sidecar/ffmpeg
          packaging/dist/engine_sidecar/ffmpeg -version | head -1
      - name: Stage ffmpeg on Windows
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 300 -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          7z t ffmpeg.zip >/dev/null
          7z x ffmpeg.zip -offmpeg-dl >/dev/null
          bin="$(find ffmpeg-dl -name ffmpeg.exe -type f | head -1)"
          test -n "$bin"
          cp "$bin" packaging/dist/engine_sidecar/ffmpeg.exe
          packaging/dist/engine_sidecar/ffmpeg.exe -version | head -1
      - name: Install JavaScript dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix frontend
      - name: Build installers without publishing
        run: npm run build
      - name: Validate and stage platform artifacts
        env:
          SOURCE_SHA: ${{ needs.validate-input.outputs.source_sha }}
          VERSION: ${{ needs.validate-input.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, stat
          version = os.environ['VERSION']
          names = {
              'ubuntu-22.04': [f'Multimedia.Downloader-{version}-1.x86_64.rpm', f'Multimedia.Downloader_{version}_amd64.AppImage', f'Multimedia.Downloader_{version}_amd64.deb'],
              'macos-15': [f'Multimedia.Downloader_{version}_aarch64.dmg'],
              'windows-latest': [f'Multimedia.Downloader_{version}_x64-setup.exe', f'Multimedia.Downloader_{version}_x64_en-US.msi'],
          }[os.environ['PLATFORM']]
          # OpenAI-Codex_safe_scope: Linux names observed in run 43884805183.
          # Windows space-separated names observed; macOS names remain unverified assumptions.
          # Unexpected source inventories fail closed; output names are canonical.
          source_names = {name: name.replace('Multimedia.Downloader', 'Multimedia Downloader', 1) for name in names}
          root = pathlib.Path('src-tauri/target/release/bundle')
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'staged-release-output'
          output.mkdir(exist_ok=False)
          suffixes = ('.rpm', '.AppImage', '.deb', '.dmg', '.msi', '-setup.exe')
          candidates = [p for p in root.rglob('*') if p.name.endswith(suffixes) and (p.is_file() or p.is_symlink())]
          if len(candidates) != len(names) or {p.name for p in candidates} != set(source_names.values()):
              raise SystemExit('Unexpected installer inventory')
          files = []
          for name in names:
              matches = list(root.rglob(source_names[name]))
              if len(matches) != 1 or not stat.S_ISREG(matches[0].lstat().st_mode) or not matches[0].resolve().is_relative_to(root.resolve()) or matches[0].stat().st_size <= 0:
                  raise SystemExit(f'Expected exactly one nonempty regular file: {name}')
              dest = output / name
              shutil.copyfile(matches[0], dest)
              digest = hashlib.file_digest(dest.open('rb'), 'sha256').hexdigest()
              files.append({'name': name, 'size': dest.stat().st_size, 'sha256': digest})
          manifest = {'sourceSha': os.environ['SOURCE_SHA'], 'version': version,
                      'runId': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                      'platform': os.environ['PLATFORM'], 'assets': files}
          (output / 'manifest.json').write_text(json.dumps(manifest, sort_keys=True), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: staged-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/staged-release-output/
          if-no-files-found: error
          retention-days: 7

  verify-artifacts:
    needs: [validate-input, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: staged-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: staged-artifacts
      - name: Verify all staged artifacts
        env:
          SOURCE_SHA: ${{ needs.validate-input.outputs.source_sha }}
          VERSION: ${{ needs.validate-input.outputs.version }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, stat
          root = pathlib.Path('staged-artifacts')
          version = os.environ['VERSION']
          required = {
              'ubuntu-22.04': {f'Multimedia.Downloader-{version}-1.x86_64.rpm', f'Multimedia.Downloader_{version}_amd64.AppImage', f'Multimedia.Downloader_{version}_amd64.deb'},
              'macos-15': {f'Multimedia.Downloader_{version}_aarch64.dmg'},
              'windows-latest': {f'Multimedia.Downloader_{version}_x64-setup.exe', f'Multimedia.Downloader_{version}_x64_en-US.msi'},
          }
          expected_dirs = {f'staged-{os.environ["GITHUB_RUN_ID"]}-{os.environ["GITHUB_RUN_ATTEMPT"]}-{p}' for p in required}
          if not root.is_dir() or {p.name for p in root.iterdir()} != expected_dirs:
              raise SystemExit('Incomplete or unexpected artifact directories')
          seen = set()
          for platform, names in required.items():
              folder = root / f'staged-{os.environ["GITHUB_RUN_ID"]}-{os.environ["GITHUB_RUN_ATTEMPT"]}-{platform}'
              if folder.is_symlink() or not folder.is_dir() or {p.name for p in folder.iterdir()} != names | {'manifest.json'}:
                  raise SystemExit('Unexpected platform artifact inventory')
              manifest_path = folder / 'manifest.json'
              if manifest_path.is_symlink() or not manifest_path.is_file() or manifest_path.stat().st_size > 65536:
                  raise SystemExit('Invalid manifest')
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              if (manifest.get('sourceSha'), manifest.get('version'), manifest.get('runId'), manifest.get('attempt'), manifest.get('platform')) != (os.environ['SOURCE_SHA'], version, os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT'], platform):
                  raise SystemExit('Manifest identity mismatch')
              entries = manifest.get('assets')
              if not isinstance(entries, list) or len(entries) != len(names) or any(not isinstance(entry, dict) for entry in entries) or {entry.get('name') for entry in entries} != names:
                  raise SystemExit('Manifest entries mismatch')
              for entry in entries:
                  path = folder / entry['name']
                  if path.is_symlink() or not stat.S_ISREG(path.lstat().st_mode) or path.stat().st_size <= 0:
                      raise SystemExit('Invalid artifact file')
                  with path.open('rb') as source:
                      digest = hashlib.file_digest(source, 'sha256').hexdigest()
                  if entry.get('size') != path.stat().st_size or entry.get('sha256') != digest or path.name in seen:
                      raise SystemExit('Artifact digest, size or uniqueness mismatch')
                  seen.add(path.name)
          if len(seen) != 6:
              raise SystemExit('Expected six unique artifacts')
          print('Six staged artifacts verified for this run; publication is not authorized.')
          PY

  protection-gate:
    needs: [validate-input, build, verify-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require independently verified protection evidence
        run: |
          echo "::error::Disabled: trusted tag protection, non-bypass actor, source provenance and legacy release isolation are not implemented."
          exit 1

  create-draft:
    needs: [validate-input, build, verify-artifacts, protection-gate]
    runs-on: ubuntu-latest
    environment: staged-release-draft
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: staged-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: staged-artifacts
      - name: Verify all staged artifacts
        env:
          SOURCE_SHA: ${{ needs.validate-input.outputs.source_sha }}
          VERSION: ${{ needs.validate-input.outputs.version }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, stat
          root = pathlib.Path('staged-artifacts')
          version = os.environ['VERSION']
          required = {
              'ubuntu-22.04': {f'Multimedia.Downloader-{version}-1.x86_64.rpm', f'Multimedia.Downloader_{version}_amd64.AppImage', f'Multimedia.Downloader_{version}_amd64.deb'},
              'macos-15': {f'Multimedia.Downloader_{version}_aarch64.dmg'},
              'windows-latest': {f'Multimedia.Downloader_{version}_x64-setup.exe', f'Multimedia.Downloader_{version}_x64_en-US.msi'},
          }
          expected_dirs = {f'staged-{os.environ["GITHUB_RUN_ID"]}-{os.environ["GITHUB_RUN_ATTEMPT"]}-{p}' for p in required}
          if not root.is_dir() or {p.name for p in root.iterdir()} != expected_dirs:
              raise SystemExit('Incomplete or unexpected artifact directories')
          seen = set()
          for platform, names in required.items():
              folder = root / f'staged-{os.environ["GITHUB_RUN_ID"]}-{os.environ["GITHUB_RUN_ATTEMPT"]}-{platform}'
              if folder.is_symlink() or not folder.is_dir() or {p.name for p in folder.iterdir()} != names | {'manifest.json'}:
                  raise SystemExit('Unexpected platform artifact inventory')
              manifest_path = folder / 'manifest.json'
              if manifest_path.is_symlink() or not manifest_path.is_file() or manifest_path.stat().st_size > 65536:
                  raise SystemExit('Invalid manifest')
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              if (manifest.get('sourceSha'), manifest.get('version'), manifest.get('runId'), manifest.get('attempt'), manifest.get('platform')) != (os.environ['SOURCE_SHA'], version, os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT'], platform):
                  raise SystemExit('Manifest identity mismatch')
              entries = manifest.get('assets')
              if not isinstance(entries, list) or len(entries) != len(names) or any(not isinstance(entry, dict) for entry in entries) or {entry.get('name') for entry in entries} != names:
                  raise SystemExit('Manifest entries mismatch')
              for entry in entries:
                  path = folder / entry['name']
                  if path.is_symlink() or not stat.S_ISREG(path.lstat().st_mode) or path.stat().st_size <= 0:
                      raise SystemExit('Invalid artifact file')
                  with path.open('rb') as source:
                      digest = hashlib.file_digest(source, 'sha256').hexdigest()
                  if entry.get('size') != path.stat().st_size or entry.get('sha256') != digest or path.name in seen:
                      raise SystemExit('Artifact digest, size or uniqueness mismatch')
                  seen.add(path.name)
          if len(seen) != 6:
              raise SystemExit('Expected six unique artifacts')
          print('Six staged artifacts verified for this run; publication is not authorized.')
          PY

      - name: Create draft and upload without replacement
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.validate-input.outputs.source_sha }}
          VERSION: ${{ needs.validate-input.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # OpenAI-Codex_safe_scope: no automatic retry or cleanup after any write.
          # Protection gate must be implemented and independently reviewed first.
          resolved="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          [[ "$resolved" == "$SOURCE_SHA" ]] || exit 1
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName --jq '.isDraft == true and .tagName == env.TAG' | grep -qx true
          paths=(
            "staged-artifacts/staged-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-ubuntu-22.04/Multimedia.Downloader-$VERSION-1.x86_64.rpm"
            "staged-artifacts/staged-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-ubuntu-22.04/Multimedia.Downloader_${VERSION}_amd64.AppImage"
            "staged-artifacts/staged-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-ubuntu-22.04/Multimedia.Downloader_${VERSION}_amd64.deb"
            "staged-artifacts/staged-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-macos-15/Multimedia.Downloader_${VERSION}_aarch64.dmg"
            "staged-artifacts/staged-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-windows-latest/Multimedia.Downloader_${VERSION}_x64-setup.exe"
            "staged-artifacts/staged-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-windows-latest/Multimedia.Downloader_${VERSION}_x64_en-US.msi"
          )
          for path in "${paths[@]}"; do
            gh release upload "$TAG" "$path" --repo "$GITHUB_REPOSITORY"
          done
          mkdir "$RUNNER_TEMP/draft-readback"
          for path in "${paths[@]}"; do
            name="${path##*/}"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$RUNNER_TEMP/draft-readback"
            cmp -s "$path" "$RUNNER_TEMP/draft-readback/$name" || exit 1
          done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,assets --jq '.isDraft == true and .tagName == env.TAG and (.assets | length == 6)' | grep -qx true
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" == "$SOURCE_SHA" ]] || exit 1
