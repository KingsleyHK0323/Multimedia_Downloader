# OpenAI-Codex: cross-check the two permanent branches.
name: Cross-branch checks

on:
  push:
    branches: [Source_Code]
  workflow_run:
    workflows: [Build and deploy preview site]
    types: [completed]
  workflow_dispatch:
    inputs:
      preview_sha:
        description: 'Optional exact deployed website commit SHA'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cross-branch-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # OpenAI-Codex: validate the pushed commit, not a later branch tip.
          ref: ${{ github.event_name == 'push' && github.sha || 'Source_Code' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check source version consistency
        run: python scripts/check_version_consistency.py

  preview-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # OpenAI-Codex: fetch trusted website history before selecting a requested commit.
      - uses: actions/checkout@v7
        with:
          ref: Multimedia_Downloader_Website
          fetch-depth: 0
          persist-credentials: false
      # BEGIN TRUSTED_PREVIEW_REF
      - name: Verify preview commit provenance
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          THIS_REPOSITORY: ${{ github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REQUESTED_SHA: ${{ inputs.preview_sha }}
        shell: bash
        run: |
          set -euo pipefail
          target=""
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            target="$REQUESTED_SHA"
          elif [[ "$EVENT_NAME" == workflow_run && "$RUN_BRANCH" == Multimedia_Downloader_Website ]]; then
            [[ "$RUN_REPOSITORY" == "$THIS_REPOSITORY" && "$RUN_CONCLUSION" == success ]] || { echo "::error::Untrusted or unsuccessful preview deployment."; exit 1; }
            [[ "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid deployed preview commit."; exit 1; }
            target="$RUN_SHA"
          fi
          if [[ -n "$target" ]]; then
            [[ "$target" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid preview commit."; exit 1; }
            git merge-base --is-ancestor "$target" HEAD || { echo "::error::Preview commit is not in the trusted website history."; exit 1; }
            git -c core.hooksPath=/dev/null checkout --detach "$target"
          fi
      # END TRUSTED_PREVIEW_REF
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install preview dependencies
        run: npm ci --no-audit --no-fund
      - name: Build preview
        run: npm run build
