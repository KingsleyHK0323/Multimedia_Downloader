# OpenAI-Codex: exercise Python across supported desktop runner environments.
name: Python matrix tests

on:
  push:
    branches: [Source_Code]
  pull_request:
    branches: [Source_Code]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # OpenAI-Codex: expose the tested PR merge context through the GitHub job name.
  dependabot-merge-context:
    name: dependabot-context-${{ github.event.pull_request.base.sha || github.sha }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.sha }}
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate context values
        env:
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          MERGE: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEAD" =~ ^[0-9a-f]{40}$ && "$BASE" =~ ^[0-9a-f]{40}$ && "$MERGE" =~ ^[0-9a-f]{40}$ ]]

  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
