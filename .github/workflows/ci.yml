name: CI

# Fast correctness gate for every branch and pull request. Release packaging is
# handled separately by release.yml when a version tag is pushed.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # OpenAI-Codex: expose the tested PR merge context through the GitHub job name.
  dependabot-merge-context:
    name: dependabot-context-${{ github.event.pull_request.base.sha || github.sha }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.sha }}
    # OpenAI-Codex_ruleset_architecture: capture the tested context for every pull request.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate context values
        env:
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          MERGE: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEAD" =~ ^[0-9a-f]{40}$ && "$BASE" =~ ^[0-9a-f]{40}$ && "$MERGE" =~ ^[0-9a-f]{40}$ ]]

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The version number lives in six files and is bumped by hand, so one of
      # them gets missed sooner or later -- Cargo.toml sat at 4.3.8 through the
      # whole 4.3.9 release, which would have stamped the wrong version into
      # the shipped binary. Stdlib-only, so it needs no install step and fails
      # in seconds.
      - name: Check version consistency
        run: python scripts/check_version_consistency.py

      - name: Validate automatic patch version bump
        run: python scripts/bump_patch_version.py --pr-number 0 --dry-run

  # OpenAI-Codex: run the real formatter selection in an isolated fixture repo.
  auto-format-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # OpenAI-Codex_format_architecture: isolate pip from checkout-local modules.
      - name: Install pinned Black
        run: python -I -m pip install black==25.1.0
      - name: Test formatter change selection
        run: node --test .github/scripts/auto-format.test.mjs

      # OpenAI-Codex_format_architecture: exercise isolated plans, artifacts and atomic App updates.
      - name: Test formatter App reconciliation
        run: node --test .github/scripts/auto-format-plan.test.mjs .github/scripts/auto-format-artifacts.test.mjs .github/scripts/auto-format-cas.test.mjs .github/scripts/auto-format-workflow.test.mjs

      # OpenAI-Codex_format_architecture: prevent release-helper formatting from creating a later bot commit.
      - name: Check release Python helper formatting
        run: >-
          python -I -m black --check --diff --no-color
          .github/scripts/download-release-artifacts.py
          .github/scripts/download-release-artifacts.test.py
          .github/scripts/stage-release-artifacts.py
          .github/scripts/stage-release-artifacts.test.py
          .github/scripts/formatter-plan.py

  # OpenAI-Codex: test the actual release input guard on Linux.
  release-input-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # OpenAI-Codex_format_architecture: check the release workflow before it is invoked.
      - name: Check automation workflow syntax and contexts
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --proto '=https' --tlsv1.2 \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz' \
            -o "$archive"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          # OpenAI-Codex_health_release_architecture: v1.7.12 predates these documented properties.
          # The cleanup mock separately asserts queue=max without cancel-in-progress.
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= \
            -ignore 'property "workflow_(sha|repository|file_path)" is not defined in object type' \
            -ignore '^unexpected key "queue" for "concurrency" section[.]' \
            .github/workflows/release.yml .github/workflows/release-build.yml .github/workflows/npm-package.yml \
            .github/workflows/clean-merged-branches.yml .github/workflows/cleanup-associated-pr-probe.yml \
            .github/workflows/first-interaction.yml .github/workflows/issue-pr-triage.yml \
            .github/workflows/auto-format.yml .github/workflows/formatter-plan.yml .github/workflows/formatter-app-cas.yml \
            .github/workflows/automation-health-cas.yml .github/workflows/website-cas.yml \
            .github/workflows/automation-health.yml .github/workflows/automation-health-merge.yml \
            .github/workflows/patch-release-observer.yml .github/workflows/auto-patch-release.yml \
            .github/workflows/auto-patch-staged.yml .github/workflows/auto-patch-cas-staged.yml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # OpenAI-Codex_format_architecture: run isolated artifact safety fixtures.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Test release input validation
        run: node --test .github/scripts/release-input-guard.test.mjs

      # OpenAI-Codex_health_release_architecture: verify exact release PR marker matching.
      - name: Test automatic release PR marker
        run: node --test .github/scripts/auto-patch-marker.test.mjs

      # OpenAI-Codex_health_release_architecture: exercise the staged end-to-end patch path without publishing.
      - name: Test staged patch automation safeguards
        env:
          PATCH_WRITER_LEGACY: ${{ vars.AUTOMATION_PATCH_PR_MODE == '' || vars.AUTOMATION_PATCH_PR_MODE == 'legacy' }}
          PATCH_CAS_ENABLED: ${{ vars.AUTOMATION_PATCH_PR_MODE == 'enabled' && vars.AUTOMATION_PATCH_CAS == 'enabled' }}
        run: |
          printf 'Patch legacy mode: %s\n' "$PATCH_WRITER_LEGACY"
          printf 'Patch CAS opt-in: %s\n' "$PATCH_CAS_ENABLED"
          node --test \
            .github/scripts/patch-release-policy.test.mjs \
            .github/scripts/patch-source-authorization.test.mjs \
            .github/scripts/patch-real-files.test.mjs \
            .github/scripts/auto-patch-pr-writer.test.mjs \
            .github/scripts/patch-push-checks.test.mjs \
            .github/scripts/patch-candidate-policy.test.mjs \
            .github/scripts/auto-patch-cas.test.mjs \
            .github/scripts/auto-patch-staged.test.mjs \
            .github/scripts/auto-patch-cas-staged.test.mjs \
            .github/scripts/patch-legacy-mode.test.mjs \
            .github/scripts/verify-published-patch.test.mjs \
            .github/scripts/patch-release-finalizer.test.mjs

      # OpenAI-Codex: exercise trusted workflow checkout boundaries.
      - name: Test trusted workflow checkouts
        run: node --test .github/scripts/workflow-ref-guard.test.mjs

      # OpenAI-Codex: reject failed, skipped and incomplete merge prerequisites.
      - name: Test required check outcomes
        run: node --test .github/scripts/required-checks.test.mjs

      # OpenAI-Codex: verify commit and pull request changelog coverage.
      - name: Test release commit changelog
        run: node --test .github/scripts/release-commit-notes.test.mjs

      # OpenAI-Codex: verify exact release asset names and sizes with fixtures.
      - name: Test release asset inventory guard
        run: node --test .github/scripts/verify-release-assets.test.mjs

      # OpenAI-Codex: exercise exact-commit release checks with fake workflow runs.
      - name: Test release publication guard
        run: node --test .github/scripts/release-publish-guard.test.mjs

      # OpenAI-Codex: verify Windows FFmpeg download failures stop the build.
      - name: Test Windows FFmpeg download guard
        run: node --test .github/scripts/release-windows-ffmpeg.test.mjs

      # OpenAI-Codex: simulate upload collisions without external calls.
      - name: Test release upload collisions
        run: node --test .github/scripts/release-upload-create-only.test.mjs

      # OpenAI-Codex_format_architecture: verify immutable artifact provenance and safe extraction.
      - name: Test release artifact selection and version data
        run: node --test .github/scripts/select-release-artifacts.test.mjs .github/scripts/verify-version-at-commit.test.mjs .github/scripts/verify-tag-protection.test.mjs .github/scripts/npm-package-guard.test.mjs
      - name: Test release artifact download and extraction
        run: |
          python -I .github/scripts/download-release-artifacts.test.py
          python -I .github/scripts/stage-release-artifacts.test.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Python was the only language here without a linter -- Rust has clippy,
      # the frontend has svelte-check. Rules live in ruff.toml, not in this
      # file, so a local run and CI cannot disagree about what is enforced.
      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check .

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          # Same file a contributor installs from, so CI and a local checkout
          # cannot drift into testing different things.
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ">=22.13.0 <23"

      # OpenAI-Codex: verify Dependabot scan-name matching with mocked APIs.
      - name: Test Dependabot watchdog scan names
        run: node --test .github/scripts/dependabot-root-scan.test.mjs

      # OpenAI-Codex: check branch-cleanup decisions without deleting refs.
      - name: Test merged branch cleanup guard
        run: node --test .github/scripts/clean-merged-branches.test.mjs

      # OpenAI-Codex_health_release_architecture: exercise the read-only GraphQL association probe.
      - name: Test cleanup association probe
        run: node --test .github/scripts/cleanup-associated-pr-probe.test.mjs

      # OpenAI-Codex: test scheduled health reporting with mocked GitHub APIs.
      - name: Test self-commit health report
        run: node --test .github/scripts/automation-health.test.mjs

      # OpenAI-Codex: verify the staged App health PR merger with mocked APIs.
      - name: Test health PR merge safeguards
        env:
          HEALTH_WRITER_LEGACY: ${{ vars.AUTOMATION_PR_MODE == '' || vars.AUTOMATION_PR_MODE == 'legacy' }}
          HEALTH_MERGER_ENABLED: ${{ vars.AUTOMATION_PR_MODE == 'enabled' && vars.AUTOMATION_SAFE_MERGE == 'enabled' }}
        run: |
          printf 'Health writer legacy mode: %s\n' "$HEALTH_WRITER_LEGACY"
          printf 'Health merger opt-in enabled: %s\n' "$HEALTH_MERGER_ENABLED"
          node --test .github/scripts/automation-health-merge.test.mjs

      # OpenAI-Codex_ruleset_architecture: test the opt-in checked health update.
      - name: Test checked health update safeguards
        env:
          HEALTH_CAS_ENABLED: ${{ vars.AUTOMATION_PR_MODE == 'enabled' && vars.AUTOMATION_HEALTH_CAS == 'enabled' }}
        run: |
          printf 'Health CAS opt-in enabled: %s\n' "$HEALTH_CAS_ENABLED"
          node --test .github/scripts/automation-health-cas.test.mjs

      # OpenAI-Codex_ruleset_architecture: verify website updates with fake GitHub APIs.
      - name: Test checked website update safeguards
        run: node --test .github/scripts/website-cas.test.mjs

      # OpenAI-Codex: verify read-only merged-event observation.
      - name: Test patch release observer
        run: node --test .github/scripts/patch-release-observer.test.mjs

      # OpenAI-Codex: exercise issue and PR triage with mocked GitHub APIs.
      - name: Test issue and PR triage
        run: node --test .github/scripts/issue-pr-triage.test.mjs

      # OpenAI-Codex: test Dependabot file-list guard with mocked metadata.
      - name: Test Dependabot file-list guard
        run: node --test .github/scripts/dependabot-workflow-guard.test.mjs

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund --prefix frontend

      - name: svelte-check
        run: npm run check --prefix frontend

      # OpenAI-Codex_Fork_GitHub_REPO: check persistence hints with in-memory fakes.
      - name: Check key storage behavior
        run: node --experimental-strip-types frontend/src/lib/keyStorage.behavior.mjs

      # OpenAI-Codex_Fork_GitHub_REPO: classify incomplete replies conservatively.
      - name: Check download outcome behavior
        run: node --experimental-strip-types frontend/src/lib/downloadOutcome.behavior.mjs

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libappindicator3-dev \
            patchelf

      # tauri-build's build.rs fails cargo check/clippy outright if the
      # bundle.resources path in tauri.conf.json doesn't exist on disk, so the
      # sidecar has to be built first even though we're not producing an
      # installer here (matches the step in release.yml).
      - name: Build Python engine sidecar (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller yt-dlp mutagen brotli certifi requests websockets
          pyinstaller packaging/engine_sidecar.spec --noconfirm --distpath packaging/dist --workpath packaging/build

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # OpenAI-Codex_Fork_GitHub_REPO: execute Rust unit tests in CI.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-targets

  weekly-preview-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v7
        with:
          ref: Multimedia_Downloader_Web_Preview
          path: preview

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: preview/package-lock.json

      - name: Install preview dependencies
        working-directory: preview
        run: npm ci --no-audit --no-fund

      - name: Build preview site
        working-directory: preview
        run: npm run build

      - name: Check deployed Pages site
        run: |
          # OpenAI-Codex: derive the Pages host from the current repository owner.
          repository_owner="${GITHUB_REPOSITORY%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          pages_url="https://${repository_owner,,}.github.io/${repository_name}/"
          status="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 10 --retry-connrefused --max-time 30 --output page.html --write-out '%{http_code}' "$pages_url")"
          test "$status" = "200"
          grep -Fq '<title>Multimedia Downloader — project field guide</title>' page.html

  # OpenAI-Codex: expose a stable, fail-closed merge-check status.
  ci-required:
    name: Required CI
    if: always()
    needs: [version-consistency, auto-format-guard, release-input-guard, lint, python-tests, frontend-check, rust-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every prerequisite to succeed
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const jobs = Object.entries(JSON.parse(process.env.REQUIRED_RESULTS));
            const failures = jobs.filter(([, job]) => job.result !== "success");
            if (jobs.length !== 7 || failures.length) {
              console.error("Required jobs did not all succeed:", failures.map(([name, job]) => name + "=" + job.result).join(", "));
              process.exit(1);
            }
          '
