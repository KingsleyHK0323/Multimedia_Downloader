# OpenAI-Codex_health_release_architecture: stage a fixed-ref checked patch coordinator.
name: Reconcile checked patch version
on:
  workflow_run:
    workflows: [CI, Python matrix tests]
    types: [completed]
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:
permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
jobs:
  update-patch:
    if: >-
      github.repository == 'KingsleyHK0323/Multimedia_Downloader' &&
      github.ref == 'refs/heads/Source_Code' &&
      vars.AUTOMATION_PATCH_PR_MODE == 'enabled' &&
      vars.AUTOMATION_PATCH_CAS == 'enabled'
    concurrency:
      group: automation-service-reconcile
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact source ref and workflow revision
        env:
          ACTUAL_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ACTUAL_REF" == 'refs/heads/Source_Code' && "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo '::error::Unexpected source ref or workflow revision.'; exit 1; }
          tip="$(gh api repos/KingsleyHK0323/Multimedia_Downloader/git/ref/heads/Source_Code --jq '.object.sha')"
          [[ "$tip" == "$WORKFLOW_SHA" ]] || { echo '::error::Source_Code changed before token creation.'; exit 1; }
      - name: Create a repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: '5868451'
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Verify and update only Source_Code
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        with:
          script: |
            // OpenAI-Codex_health_release_architecture: the App-token job executes only this trusted inline script.
            const { createHash } = require('node:crypto');
            const { ANCHOR_PATH, ANCHOR_CONTENT, currentPatchLabel, labelAtMerge, utcSecond } = (() => {
            // BEGIN EXACT SOURCE AUTHORIZATION HELPER
            // OpenAI-Codex_format_architecture: reconstruct source-label authorization from the complete PR timeline.
            // OpenAI-Codex_health_release_architecture: bind owner and immutable label identity across REST and GraphQL.
            const SECOND = /^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$/;
            const SHA = /^[0-9a-f]{40}$/;
            const OWNER_ID = 157894869;
            const OWNER_NODE = 'U_kgDOCWlI1Q';
            const REPO_ID = 1251103365;
            const PATCH_LABEL_ID = 'LA_kwDOSpJShc8AAAADEWCHJg';
            const PATCH_LABEL_CREATED = '2026-11-22T06:44:42Z';
            const ANCHOR_PATH = '.github/automation/patch-release-pr-v1.txt';
            const ANCHOR_CONTENT = 'OpenAI-Codex_format_architecture: auto-patch PR mode migration v1\n';
            function utcSecond(value) {
              if (typeof value !== 'string' || !SECOND.test(value)) throw new Error('Invalid exact UTC timestamp.');
              const time = Date.parse(value);
              if (!Number.isFinite(time) || new Date(time).toISOString() !== value.slice(0, -1) + '.000Z') {
                throw new Error('Invalid exact UTC timestamp.');
              }
              return time;
            }
            const LABEL_NODES_QUERY = `
              query PatchLabelEventNodes($ids: [ID!]!) {
                nodes(ids: $ids) {
                  __typename
                  ... on LabeledEvent {
                    id createdAt
                    actor { __typename ... on User { id databaseId } ... on Bot { id } }
                    label { id name createdAt updatedAt repository { databaseId } }
                    labelable { __typename ... on PullRequest { number repository { databaseId } } }
                  }
                  ... on UnlabeledEvent {
                    id createdAt
                    actor { __typename ... on User { id databaseId } ... on Bot { id } }
                    label { id name createdAt updatedAt repository { databaseId } }
                    labelable { __typename ... on PullRequest { number repository { databaseId } } }
                  }
                }
              }
            `;
            function currentPatchLabel(pr) {
              if (!Array.isArray(pr?.labels) || pr.labels.some(label => !label || typeof label.name !== 'string')) {
                throw new Error('Current source PR labels are incomplete.');
              }
              const relevant = pr.labels.filter(label =>
                label.name.toLowerCase() === 'release:patch' || label.node_id === PATCH_LABEL_ID);
              if (!relevant.length) return false;
              if (relevant.length !== 1 || relevant[0].name !== 'release:patch' || relevant[0].node_id !== PATCH_LABEL_ID) {
                throw new Error('Current patch label identity is ambiguous.');
              }
              return true;
            }
            async function labelAtMerge(events, mergedAt, mergeSha, github, sourceNumber) {
              const mergedTime = utcSecond(mergedAt);
              if (!Array.isArray(events) || events.length > 10_000 || !SHA.test(mergeSha || '') ||
                  !github || typeof github.graphql !== 'function' || typeof github.paginate !== 'function' ||
                  !github.rest?.issues?.listEventsForTimeline ||
                  !Number.isSafeInteger(sourceNumber) || sourceNumber <= 0) {
                throw new Error('Source PR timeline is incomplete.');
              }
              const merged = events.filter(event => event?.event === 'merged');
              if (merged.length !== 1 || merged[0].created_at !== mergedAt || merged[0].commit_id !== mergeSha) {
                throw new Error('Source PR merge timeline is incomplete or inconsistent.');
              }
              const changes = [];
              const seen = new Set();
              for (const event of events) {
                if (!event || typeof event.event !== 'string') throw new Error('Source PR timeline has an incomplete event.');
                if (!['labeled', 'unlabeled'].includes(event.event)) continue;
                if (typeof event.node_id !== 'string' || !event.node_id || seen.has(event.node_id) ||
                    typeof event.label?.name !== 'string' || !event.label.name ||
                    !event.actor || !['User', 'Bot'].includes(event.actor.type) ||
                    typeof event.actor.node_id !== 'string' || !event.actor.node_id ||
                    !Number.isSafeInteger(event.actor.id) || event.actor.id <= 0) {
                  throw new Error('A source PR label event is incomplete.');
                }
                seen.add(event.node_id);
                changes.push({ event, time: utcSecond(event.created_at) });
              }
              const fingerprint = timeline => {
                if (!Array.isArray(timeline) || timeline.length > 10_000) throw new Error('Source PR timeline is incomplete.');
                const selected = [];
                for (const event of timeline) {
                  if (!event || typeof event.event !== 'string') throw new Error('Source PR timeline has an incomplete event.');
                  if (['merged', 'labeled', 'unlabeled'].includes(event.event)) {
                    selected.push([event.event, event.node_id ?? null, event.created_at ?? null, event.commit_id ?? null,
                      event.label?.name ?? null, event.actor?.id ?? null, event.actor?.node_id ?? null, event.actor?.type ?? null]);
                  }
                }
                return JSON.stringify(selected);
              };
              const metadata = new Map();
              for (let offset = 0; offset < changes.length; offset += 100) {
                const chunk = changes.slice(offset, offset + 100);
                const response = await github.graphql(LABEL_NODES_QUERY, { ids: chunk.map(item => item.event.node_id) });
                if (!response || !Array.isArray(response.nodes) || response.nodes.length !== chunk.length) {
                  throw new Error('GraphQL label event response is incomplete.');
                }
                for (let index = 0; index < chunk.length; index++) {
                  const item = chunk[index], event = item.event, node = response.nodes[index];
                  const expectedType = event.event === 'labeled' ? 'LabeledEvent' : 'UnlabeledEvent';
                  if (!node || node.id !== event.node_id || node.__typename !== expectedType ||
                      node.createdAt !== event.created_at || !node.actor ||
                      node.actor.__typename !== event.actor.type || node.actor.id !== event.actor.node_id ||
                      (node.actor.__typename === 'User' && node.actor.databaseId !== event.actor.id) ||
                      !node.label || typeof node.label.id !== 'string' || !node.label.id ||
                      typeof node.label.name !== 'string' || !node.label.name ||
                      node.label.repository?.databaseId !== REPO_ID ||
                      node.labelable?.__typename !== 'PullRequest' ||
                      node.labelable.number !== sourceNumber || node.labelable.repository?.databaseId !== REPO_ID) {
                    throw new Error('REST and GraphQL source label events disagree.');
                  }
                  const label = node.label;
                  const prior = metadata.get(label.id);
                  const description = JSON.stringify([label.name, label.createdAt, label.updatedAt, label.repository.databaseId]);
                  if (prior !== undefined && prior !== description) {
                    throw new Error('Label metadata changed during source authorization.');
                  }
                  metadata.set(label.id, description);
                  item.label = label;
                }
              }
              const confirm = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner: 'KingsleyHK0323', repo: 'Multimedia_Downloader', issue_number: sourceNumber, per_page: 100,
              });
              if (fingerprint(events) !== fingerprint(confirm)) throw new Error('Source PR timeline changed during authorization.');
              if (changes.some(item => item.label.id !== PATCH_LABEL_ID &&
                  (item.label.name === 'release:patch' || item.event.label.name === 'release:patch'))) {
                throw new Error('Patch label identity is not the approved label.');
              }
              const withdrawnAfterMerge = changes.some(item => item.label.id === PATCH_LABEL_ID &&
                item.event.event === 'unlabeled' && item.time > mergedTime);
              const relevant = changes.filter(item => item.label.id === PATCH_LABEL_ID && item.time <= mergedTime)
                .sort((a, b) => a.time - b.time);
              let active = null, previousTime = null;
              for (const item of relevant) {
                if (item.time === mergedTime) throw new Error('Patch label changed in the same second as merge.');
                if (item.time === previousTime) throw new Error('Patch label events have ambiguous ordering.');
                const { label, event, time } = item;
                const created = utcSecond(label.createdAt), updated = utcSecond(label.updatedAt);
                if (label.name !== 'release:patch' || label.createdAt !== PATCH_LABEL_CREATED ||
                    created > updated || updated >= time || event.label.name !== 'release:patch') {
                  throw new Error('Patch label identity or historical name cannot be established.');
                }
                if ((event.event === 'labeled') === Boolean(active)) {
                  throw new Error('Patch label history is incomplete or inconsistent.');
                }
                active = event.event === 'labeled' ? item : null;
                previousTime = time;
              }
              if (!active) return { atMerge: false, withdrawnAfterMerge };
              if (active.event.actor.type !== 'User' || active.event.actor.id !== OWNER_ID ||
                  active.event.actor.node_id !== OWNER_NODE) {
                throw new Error('Effective patch label was not added by the repository owner.');
              }
              return { atMerge: true, withdrawnAfterMerge };
            }
            // END EXACT SOURCE AUTHORIZATION HELPER
            return { ANCHOR_PATH, ANCHOR_CONTENT, currentPatchLabel, labelAtMerge, utcSecond };
            })();
            const { planVersion, validateSourcePr, validateVersionPr, versionBranch, VERSION_PATHS } = (() => {
            // BEGIN EXACT PATCH POLICY
            // OpenAI-Codex_format_architecture: deterministic, non-executing patch-release policy.
            const SHA = /^[0-9a-f]{40}$/;
            const VERSION = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
            const SOURCE_REPO = 'KingsleyHK0323/Multimedia_Downloader';
            // OpenAI-Codex_health_release_architecture: share the single approved temporary branch.
            const SOURCE_REPO_ID = 1251103365;
            const FIXED_BRANCH = 'automation/protected-workflows';
            const APP_BOT_ID = 359694872;
            const VERSION_PATHS = Object.freeze([
              'package.json', 'package-lock.json', 'frontend/package.json', 'frontend/package-lock.json',
              'src-tauri/tauri.conf.json', 'src-tauri/Cargo.toml', 'src-tauri/Cargo.lock',
              'README.md', 'CHANGELOG.md', 'engine/__init__.py',
            ]);
            function fail(message) { throw new Error(message); }
            function canonicalNumber(value) {
              return Number.isSafeInteger(value) && value > 0;
            }
            function replaceExactly(source, pattern, replacer, wanted, name) {
              let n = 0;
              const result = source.replace(pattern, (...args) => {
                n++;
                return replacer(...args);
              });
              if (n !== wanted) fail('Unexpected version fields in ' + name);
              return result;
            }
            function updateJson(source, oldVersion, version, isLock, name) {
              const data = JSON.parse(source);
              if (!data || Array.isArray(data) || data.version !== oldVersion) fail('Invalid root version in ' + name);
              if (isLock && (!data.packages?.[''] || data.packages[''].version !== oldVersion)) {
                fail('Invalid root lock package version in ' + name);
              }
              const expected = structuredClone(data);
              expected.version = version;
              if (isLock) expected.packages[''].version = version;
              const escaped = oldVersion.replaceAll('.', '\\.');
              const pattern = new RegExp('("version"\\s*:\\s*")' + escaped + '(")', 'g');
              let replaced = 0;
              const output = source.replace(pattern, (match, prefix, suffix) => {
                if (replaced >= (isLock ? 2 : 1)) return match;
                replaced++;
                return prefix + version + suffix;
              });
              if (replaced !== (isLock ? 2 : 1) ||
                  JSON.stringify(JSON.parse(output)) !== JSON.stringify(expected)) {
                fail('JSON version fields are ambiguous in ' + name);
              }
              return output;
            }
            function checkDate(value) {
              if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) fail('Invalid release date.');
              const date = new Date(value + 'T00:00:00Z');
              if (Number.isNaN(date.valueOf()) || date.toISOString().slice(0, 10) !== value) {
                fail('Invalid release date.');
              }
            }
            function promoteChangelog(source, version, date, number) {
              const lines = source.match(/.*(?:\r?\n|$)/g)?.filter(Boolean) || [];
              const i = lines.findIndex(line => /^### Unreleased\s*$/.test(line));
              if (i < 0) fail('Unreleased changelog section is missing.');
              let end = lines.findIndex((line, n) => n > i && /^### /.test(line));
              if (end < 0) end = lines.length;
              let notes = lines.slice(i + 1, end).join('').trim();
              if (!notes) notes = '#### Maintenance\n- Automated patch release after merged pull request #' + number + '.';
              return lines.slice(0, i + 1).join('') + '\n### [' + version + '] — ' + date +
                '\n\n' + notes + '\n\n' + lines.slice(end).join('');
            }
            function planVersion(files, sourcePrNumber, date) {
              if (!canonicalNumber(sourcePrNumber)) fail('Invalid source PR number.');
              checkDate(date);
              if (!files || VERSION_PATHS.some(path => typeof files[path] !== 'string')) fail('Version files are incomplete.');
              if (VERSION_PATHS.some(path => files[path].includes('\r'))) fail('Version files must use LF line endings.');
              const data = JSON.parse(files['package.json']);
              const current = data?.version;
              const match = typeof current === 'string' && current.match(VERSION);
              if (!match || current.length > 49) fail('Invalid current version.');
              const patch = BigInt(match[3]) + 1n;
              const version = match[1] + '.' + match[2] + '.' + patch.toString();
              if (version.length > 50 || version === '4.3.3') fail('This version requires separate release authorization.');
              const updates = {};
              for (const [name, lock] of [
                ['package.json', false], ['package-lock.json', true],
                ['frontend/package.json', false], ['frontend/package-lock.json', true],
                ['src-tauri/tauri.conf.json', false],
              ]) updates[name] = updateJson(files[name], current, version, lock, name);
              const escaped = current.replaceAll('.', '\\.');
              updates['src-tauri/Cargo.toml'] = replaceExactly(
                files['src-tauri/Cargo.toml'], new RegExp('^version\\s*=\\s*"' + escaped + '"$', 'gm'),
                () => 'version = "' + version + '"', 1, 'src-tauri/Cargo.toml'
              );
              updates['src-tauri/Cargo.lock'] = replaceExactly(
                files['src-tauri/Cargo.lock'], new RegExp('(^name = "multimedia-downloader"\\nversion = ")' + escaped + '("$)', 'gm'),
                (_, prefix, suffix) => prefix + version + suffix, 1, 'src-tauri/Cargo.lock'
              );
              updates['README.md'] = replaceExactly(
                files['README.md'], new RegExp('^(# Multimedia Downloader — V)' + escaped + '$', 'gm'),
                (_, prefix) => prefix + version, 1, 'README.md'
              );
              updates['engine/__init__.py'] = replaceExactly(
                files['engine/__init__.py'], new RegExp('^(__version__\\s*=\\s*")' + escaped + '("$)', 'gm'),
                (_, prefix, suffix) => prefix + version + suffix, 1, 'engine/__init__.py'
              );
              updates['CHANGELOG.md'] = promoteChangelog(files['CHANGELOG.md'], version, date, sourcePrNumber);
              if (VERSION_PATHS.some(path => updates[path] === files[path])) fail('An expected version file did not change.');
              return { sourcePrNumber, oldVersion: current, version, tag: 'v' + version, updates };
            }
            function validateSourcePr(pr, { requireCurrentLabel = true } = {}) {
              if (!pr || !canonicalNumber(pr.number) || pr.state !== 'closed' || pr.merged !== true ||
                  typeof pr.merged_at !== 'string' || Number.isNaN(Date.parse(pr.merged_at)) ||
                  pr.base?.ref !== 'Source_Code' || pr.base?.repo?.id !== SOURCE_REPO_ID ||
                  pr.base.repo.full_name !== SOURCE_REPO ||
                  !canonicalNumber(pr.user?.id) || pr.user.id === APP_BOT_ID ||
                  !Array.isArray(pr.labels) || (requireCurrentLabel && !pr.labels.some(label => label?.name === 'release:patch')) ||
                  !SHA.test(pr.merge_commit_sha || '')) {
                fail('Source PR is not an eligible merged, labeled Source_Code change.');
              }
              return { number: pr.number, mergeSha: pr.merge_commit_sha };
            }
            function versionBranch(number) {
              if (!canonicalNumber(number)) fail('Invalid source PR number.');
              return FIXED_BRANCH;
            }
            function validateVersionPr(pr, source, { requireMerged = false, requireCurrentLabel = true } = {}) {
              validateSourcePr(source, { requireCurrentLabel });
              if (!pr || !canonicalNumber(pr.number) || pr.user?.id !== APP_BOT_ID ||
                  pr.base?.ref !== 'Source_Code' || pr.base?.repo?.id !== SOURCE_REPO_ID ||
                  pr.base.repo.full_name !== SOURCE_REPO || pr.head?.repo?.id !== SOURCE_REPO_ID ||
                  pr.head.repo.full_name !== SOURCE_REPO || pr.head?.ref !== versionBranch(source.number) ||
                  !SHA.test(pr.head?.sha || '') || !SHA.test(pr.base?.sha || '') ||
                  pr.draft !== false || pr.auto_merge !== null || !Array.isArray(pr.labels) ||
                  pr.labels.some(label => typeof label?.name !== 'string' || label.name.toLowerCase() === 'release:patch')) {
                fail('Version PR is not the expected App-authored Source_Code request.');
              }
              const marker = '<!-- automatic-patch-source:' + source.number + ':' + source.merge_commit_sha + ' -->';
              if (typeof pr.body !== 'string' || pr.body.split('\n').filter(line => line === marker).length !== 1) {
                fail('Version PR does not identify the exact source PR and merge commit.');
              }
              if (requireMerged && (pr.state !== 'closed' || pr.merged !== true || !SHA.test(pr.merge_commit_sha || ''))) {
                fail('Version PR has not merged.');
              }
              return { source: source.number, base: pr.base.sha, head: pr.head.sha,
                merge: requireMerged ? pr.merge_commit_sha : null };
            }
            // END EXACT PATCH POLICY
            return { planVersion, validateSourcePr, validateVersionPr, versionBranch, VERSION_PATHS };
            })();
            const { validatePatchCandidate } = (() => {
            // BEGIN EXACT PATCH CANDIDATE POLICY
            // OpenAI-Codex_health_release_architecture: validate an exact, signed single-parent version candidate.
            
            const SHA = /^[0-9a-f]{40}$/;
            const REPO = 'KingsleyHK0323/Multimedia_Downloader';
            const BOT = 'kingsley-multimedia-automation[bot]';
            const APP_ID = 359694872;
            const MAX_FILE = 5_000_000;
            const blobHash = bytes => createHash('sha1')
              .update(Buffer.concat([Buffer.from('blob ' + bytes.length + '\0'), bytes])).digest('hex');
            
            function entries(items) {
              if (!Array.isArray(items) || items.length > 100000) throw new Error('Tree inventory is incomplete.');
              const result = new Map();
              for (const item of items) {
                if (!item || typeof item.path !== 'string' || !item.path || result.has(item.path) ||
                    !SHA.test(item.sha || '') || typeof item.mode !== 'string' ||
                    !['blob', 'tree', 'commit'].includes(item.type)) {
                  throw new Error('Tree entry is malformed or duplicated.');
                }
                result.set(item.path, item);
              }
              return result;
            }
            function commitMessage(plan, source, date) {
              return 'chore: release ' + plan.tag + ' after PR #' + source.number + '\n\n' +
                'Automatic patch release for merged PR #' + source.number + '\n' +
                'Patch-Source-SHA: ' + source.mergeSha + '\n' +
                'Patch-Plan-Date: ' + date + '\n' +
                'OpenAI-Codex_health_release_architecture';
            }
            
            function validatePatchCandidate({ source, versionPr, base, headCommit, signedCommit,
              baseTree, headTree, files, changedFiles, phase = 'open' }) {
