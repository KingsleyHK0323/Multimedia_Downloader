                  const id = job.check_run_url.slice(prefix.length);
                  if (!/^[1-9][0-9]*$/.test(id) || !Number.isSafeInteger(Number(id))) throw Error("invalid check");
                  return id;
                });
                if (ids[0] === ids[1]) process.exit(1);
                process.stdout.write(ids.join(" "));
              } catch { process.exit(1); }
            ')"; then
            echo "::warning::Required jobs are missing or incomplete; skipping update."
            exit 0
          fi
          read -r ci_check_id matrix_check_id <<< "$check_ids"
