                const expected = [
                  [".github/workflows/ci.yml", Number(process.env.CI_ID), Number(process.env.CI_ATTEMPT), 318584423],
                  [".github/workflows/python-matrix.yml", Number(process.env.MATRIX_ID), Number(process.env.MATRIX_ATTEMPT), 422035428],
                ];
                for (const [path, id, attempt, workflowId] of expected) {
                  const matches = data.workflow_runs.filter(r => r.path === path && r.head_sha === process.env.HEAD_SHA);
                  if (matches.some(r => !Number.isSafeInteger(r.id) || r.id < 1)) process.exit(1);
                  const run = matches.sort((a, b) => b.id - a.id)[0];
                  if (!run || run.id !== id || run.run_attempt !== attempt ||
                      run.workflow_id !== workflowId || run.event !== "pull_request" ||
                      run.actor?.id !== 49699333 || run.actor?.login !== "dependabot[bot]" ||
                      run.actor?.type !== "Bot" ||
                      run.repository?.id !== 1251103365 || run.head_repository?.id !== 1251103365 ||
                      run.status !== "completed" || run.conclusion !== "success") process.exit(1);
                }
              } catch { process.exit(1); }
            '; then
            echo "::warning::The PR, base branch, merge commit or test runs changed; skipping merge."
            exit 0
          fi

          # OpenAI-Codex_ruleset_architecture: do not indirectly close another PR
