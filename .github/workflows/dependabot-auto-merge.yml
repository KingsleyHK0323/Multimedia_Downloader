name: Dependabot auto-merge

# Merge only after the full CI workflow for a Dependabot PR has succeeded.
# This privileged workflow uses API/CLI operations only and never checks out
# or executes code from the pull request.
on:
  workflow_run:
    workflows: [CI, Python matrix tests]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge successful Dependabot PR and request its release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The CI run did not provide a valid commit SHA."
            exit 1
          fi

          pr_number="$(gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/pulls" \
            --jq ".[] | select(.state == \"open\" and .user.login == \"dependabot[bot]\" and .base.ref == \"Source_Code\" and .head.sha == \"${HEAD_SHA}\") | .number" \
            | head -n 1)"
          if [ -z "${pr_number}" ]; then
            echo "No open Dependabot PR targeting Source_Code is associated with this successful CI run."
            exit 0
          fi

          # OpenAI-Codex: both latest PR test workflows must pass for this head.
          runs="$(gh api "repos/${GH_REPO}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100")"
          if ! printf '%s' "$runs" | node -e '
            const fs = require("fs");
            try {
              const data = JSON.parse(fs.readFileSync(0, "utf8"));
              if (!Array.isArray(data.workflow_runs) || data.total_count > 100) process.exit(1);
              const runs = data.workflow_runs;
              for (const path of [".github/workflows/ci.yml", ".github/workflows/python-matrix.yml"]) {
                const latest = runs.filter(r => r.path === path && r.head_sha === process.env.HEAD_SHA)
                  .sort((a, b) => b.id - a.id)[0];
                if (!latest || latest.status !== "completed" || latest.conclusion !== "success") process.exit(1);
              }
            } catch { process.exit(1); }
          '; then
            echo "Waiting for successful CI and Python matrix runs on the same head."
            exit 0
          fi

          workflow_files="$(gh api "repos/${GH_REPO}/pulls/${pr_number}/files" \
            --jq '.[].filename | select(startswith(".github/workflows/"))')"
          if [ -n "${workflow_files}" ]; then
            echo "Skipping PR #${pr_number}: updating GitHub Actions workflow files requires a separate Workflows permission."
            exit 0
          fi

          # OpenAI-Codex: fail closed on incomplete or protected workflow paths.
          if ! guard_pr="$(gh api "repos/$GH_REPO/pulls/$pr_number")" ||
             ! guard_pages="$(gh api --paginate --slurp "repos/$GH_REPO/pulls/$pr_number/files?per_page=100")"; then
            echo "::warning::Cannot inspect every PR file; skipping merge."
            exit 0
          fi
          if ! printf '%s\0%s' "$guard_pr" "$guard_pages" | node -e '
            const fs = require("fs");
            try {
              const parts = fs.readFileSync(0, "utf8").split("\0");
              if (parts.length !== 2) process.exit(1);
              const pr = JSON.parse(parts[0]);
              const pages = JSON.parse(parts[1]);
              if (pr.state !== "open" || pr.base?.ref !== "Source_Code" ||
                  pr.head?.sha !== process.env.HEAD_SHA ||
                  !Number.isInteger(pr.changed_files) || pr.changed_files < 1 || pr.changed_files > 3000 ||
                  !Array.isArray(pages) || !pages.every(Array.isArray)) process.exit(1);
              const files = pages.flat();
              if (files.length !== pr.changed_files) process.exit(1);
              const unsafe = p => p.startsWith(".github/workflows/") || p.startsWith(".github/actions/");
              if (!files.every(f => f && typeof f.filename === "string" && f.filename.length > 0 &&
                  typeof f.status === "string" && f.status.length > 0 &&
                  (f.status !== "renamed" || (typeof f.previous_filename === "string" && f.previous_filename.length > 0)) &&
                  (f.previous_filename === undefined || (typeof f.previous_filename === "string" && f.previous_filename.length > 0)) &&
                  !unsafe(f.filename) && (f.previous_filename === undefined || !unsafe(f.previous_filename)))) process.exit(1);
            } catch { process.exit(1); }
          '; then
            echo "::warning::PR file list or identity is unsafe or incomplete; skipping merge."
            exit 0
          fi

          # OpenAI-Codex: merge only the exact commit whose CI run succeeded.
          gh pr merge "${pr_number}" --squash --match-head-commit "${HEAD_SHA}"
          # OpenAI-Codex: bot merges do not trigger normal PR workflows; request cleanup explicitly.
          gh workflow run clean-merged-branches.yml --ref Source_Code -f pr_number="${pr_number}"
          release_label="$(gh api "repos/${GH_REPO}/pulls/${pr_number}" \
            --jq '[.labels[].name] | any(. == "release:patch")')"
          if [ "${release_label}" = "true" ]; then
            gh workflow run auto-patch-release.yml --ref Source_Code \
              -f pr_number="${pr_number}"
          else
            echo "PR #${pr_number} does not have the release:patch label; skipping automatic release."
          fi
