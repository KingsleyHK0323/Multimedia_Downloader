              "repos/$GH_REPO/rules/branches/Source_Code?per_page=100")" ||
              [[ "$rules_final" != "$rule_pages" ]]; then
            echo "::warning::Source_Code rules changed; skipping update."
            exit 0
          fi
          for rule_id in $rule_ids; do
            if ! rule_detail="$(GH_TOKEN="$APP_TOKEN" gh api "repos/$GH_REPO/rulesets/$rule_id?includes_parents=true")" ||
               ! printf '%s' "$rule_detail" | RULE_ID="$rule_id" node -e '
                const fs = require("fs");
                try {
                  const r = JSON.parse(fs.readFileSync(0, "utf8"));
                  if (r.id !== Number(process.env.RULE_ID) || r.enforcement !== "active" ||
                      r.target !== "branch" || r.current_user_can_bypass !== "never" ||
                      !Array.isArray(r.rules)) process.exit(1);
                } catch { process.exit(1); }
              '; then
              echo "::warning::App bypass or ruleset state changed; skipping update."
              exit 0
            fi
          done

          # Re-read exact PR, base and both run attempts after token creation.
          pr_number="$PR_NUMBER"
          selected="$CI_ID $CI_ATTEMPT $MATRIX_ID $MATRIX_ATTEMPT"
          read -r ci_id ci_attempt matrix_id matrix_attempt <<< "$selected"
          if ! ci_jobs="$(gh api "repos/$GH_REPO/actions/runs/$ci_id/attempts/$ci_attempt/jobs?per_page=100")" ||
             ! matrix_jobs="$(gh api "repos/$GH_REPO/actions/runs/$matrix_id/attempts/$matrix_attempt/jobs?per_page=100")" ||
             ! current_pr="$(gh api "repos/$GH_REPO/pulls/$pr_number")" ||
             ! base_head="$(gh api "repos/$GH_REPO/git/ref/heads/Source_Code" --jq '.object.sha')" ||
             ! latest_runs="$(gh api "repos/$GH_REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100")"; then
