            node -e '
              const fs = require("fs");
              try {
                const input = fs.readFileSync(0, "utf8").split("\0");
                if (input.length !== 4) process.exit(1);
                const [pr, data, ci, matrix] = input.map(JSON.parse);
                const sha = value => typeof value === "string" && /^[0-9a-f]{40}$/.test(value);
                if (!sha(process.env.BASE_HEAD) || pr.number !== Number(process.env.PR_NUMBER) ||
                    pr.state !== "open" || pr.draft !== false || pr.user?.login !== "dependabot[bot]" ||
                    pr.user?.id !== 49699333 || pr.user?.type !== "Bot" || pr.mergeable !== true ||
                    pr.base?.repo?.id !== 1251103365 || pr.head?.repo?.id !== 1251103365 ||
                    pr.base?.repo?.full_name !== "KingsleyHK0323/Multimedia_Downloader" ||
                    pr.head?.repo?.full_name !== "KingsleyHK0323/Multimedia_Downloader" ||
                    pr.base?.ref !== "Source_Code" || pr.base?.sha !== process.env.BASE_HEAD ||
                    pr.head?.sha !== process.env.HEAD_SHA || pr.merge_commit_sha !== process.env.MERGE_SHA ||
                    !sha(pr.merge_commit_sha)) process.exit(1);
                const contextName = "dependabot-context-" + pr.base.sha + "-" + pr.head.sha + "-" + pr.merge_commit_sha;
                for (const response of [ci, matrix]) {
                  if (!Array.isArray(response.jobs) || !Number.isSafeInteger(response.total_count) ||
                      response.total_count > 100 || response.total_count !== response.jobs.length) process.exit(1);
                  const contexts = response.jobs.filter(j => j.name === contextName);
                  if (contexts.length !== 1 || contexts[0].status !== "completed" || contexts[0].conclusion !== "success") process.exit(1);
                }
                if (!Array.isArray(data.workflow_runs) || !Number.isSafeInteger(data.total_count) ||
