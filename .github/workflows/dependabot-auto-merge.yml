             ! matrix_check="$(gh api "repos/$GH_REPO/check-runs/$matrix_check_id")" ||
             ! printf '%s\0%s' "$ci_check" "$matrix_check" | CI_CHECK_ID="$ci_check_id" MATRIX_CHECK_ID="$matrix_check_id" node -e '
              const fs = require("fs");
              try {
                const chunks = fs.readFileSync(0, "utf8").split("\0");
