name: Website build check
# OpenAI-Codex: validate website changes without publishing a deployment.

on:
  push:
    # OpenAI-Codex_ruleset_architecture: test the approved temporary website candidate before updating the protected branch.
    branches: [Multimedia_Downloader_Website, automation/protected-workflows]
  pull_request:
    branches: [Multimedia_Downloader_Website]

permissions:
  contents: read

concurrency:
  group: website-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Required Website build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
