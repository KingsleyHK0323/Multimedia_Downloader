name: Verify repository automation App
# OpenAI-Codex: check the installed App without modifying repository data.

on:
  workflow_dispatch:
  # OpenAI-Codex: re-verify the App when this trusted workflow changes.
  push:
    branches: [Source_Code]
    paths: [.github/workflows/verify-automation-app.yml]

permissions: {}

jobs:
  verify:
    if: github.repository == 'KingsleyHK0323/Multimedia_Downloader' && github.ref == 'refs/heads/Source_Code'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create a narrowly scoped installation token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: '5868451'
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Check accessible repository without changes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api /installation/repositories | jq -e --arg repo "$GITHUB_REPOSITORY" \
            '.repositories | (length == 1 and .[0].full_name == $repo)' > /dev/null
          echo 'App authentication and repository scope verified.'
      # OpenAI-Codex_health_release_architecture: inspect only the App actor's bypass mode.
      - name: Check ruleset bypass visibility without changes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          mode="$(gh api "repos/$GITHUB_REPOSITORY/rulesets/27644518" --jq '.current_user_can_bypass // "missing"')"
          case "$mode" in
            never|always|pull_requests_only|exempt) printf 'App bypass mode: %s\n' "$mode" ;;
            *) echo '::error::App bypass mode is missing or unknown.'; exit 1 ;;
          esac
      # OpenAI-Codex: resolve the App bot identity without repository writes.
      - name: Verify App bot identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_SLUG" = 'kingsley-multimedia-automation'
          bot="$(gh api "/users/${APP_SLUG}%5Bbot%5D")"
          jq -e --arg login "${APP_SLUG}[bot]" '.login == $login and .type == "Bot" and (.id | type == "number" and . > 0 and floor == .)' <<< "$bot" >/dev/null
          printf 'App bot user ID: %s\n' "$(jq -r '.id' <<< "$bot")"
      # OpenAI-Codex: confirm the private App metadata is visible to its own token.
      - name: Verify App metadata identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_SLUG" = 'kingsley-multimedia-automation'
          app_id="$(gh api "/apps/$APP_SLUG" --jq '.id')"
          test "$app_id" = '5868451'
          echo 'App metadata identity verified.'
