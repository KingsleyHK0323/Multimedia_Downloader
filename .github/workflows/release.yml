name: Release build

# Builds the desktop installers for Linux, macOS, and Windows and uploads them
# to the matching GitHub Release. It can run on a version tag push (v*), be
# started manually against an existing tag, or be called by the automatic patch
# release workflow after a pull request is merged into `Source_Code`.
# This workflow creates the GitHub Release automatically if one doesn't
# already exist for the tag (with
# GitHub's auto-generated notes as a placeholder) and uploads all 3
# platforms' installers to it. Polished tri-lingual release notes can be
# added afterwards with `gh release edit vX.Y.Z --notes-file ...` — that's
# independent of the build/upload and can happen before or after.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach installers to (e.g. v4.1.0)"
        required: true
        default: v4.1.0
      only:
        description: "Limit the build to one platform (default: all)"
        type: choice
        default: all
        options:
          - all
          - ubuntu-22.04
          - macos-15
          - windows-latest
      verify_only:
        description: Build and verify artifacts without modifying a GitHub Release
        type: boolean
        default: false
        required: false
  workflow_call:
    inputs:
      tag:
        description: "Version tag to build"
        required: true
        type: string
      only:
        description: "Limit the build to one platform (default: all)"
        required: false
        default: all
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # OpenAI-Codex: validate inputs before existing shell interpolation.
      # BEGIN RELEASE_INPUT_GUARD
      - name: Validate release inputs
        env:
          RAW_TAG: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
          RAW_ONLY: ${{ inputs.only || github.event.inputs.only || 'all' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ${#RAW_TAG} -gt 51 ]] || [[ ! "$RAW_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf '%s\n' '::error::Invalid release tag.'
            exit 1
          fi
          case "$RAW_ONLY" in
            all|ubuntu-22.04|macos-15|windows-latest) ;;
            *) printf '%s\n' '::error::Invalid release platform.'; exit 1 ;;
          esac
      # END RELEASE_INPUT_GUARD
      # OpenAI-Codex: keep validated user input out of generated shell code.
      - id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - id: m
        env:
          RELEASE_ONLY: ${{ inputs.only || github.event.inputs.only || 'all' }}
        shell: bash
        run: |
          only="$RELEASE_ONLY"
          if [ "$only" = "all" ]; then
            echo 'matrix={"platform":["ubuntu-22.04","macos-15","windows-latest"]}' >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"platform\":[\"$only\"]}" >> "$GITHUB_OUTPUT"
          fi

      # OpenAI-Codex: verification cannot publish and must cover all platforms.
      - name: Validate verification-only mode
        if: inputs.verify_only == true
        env:
          SOURCE_REF: ${{ github.ref }}
          ONLY: ${{ inputs.only }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EVENT" == workflow_dispatch && "$SOURCE_REF" == refs/heads/Source_Code && "$ONLY" == all ]] || { echo "::error::Verification requires all platforms on Source_Code."; exit 1; }

      # OpenAI-Codex: create the requested beta tag only from Source_Code.
      - name: Prepare v4.3.22 beta tag
        if: github.event_name == 'workflow_dispatch' && steps.tag.outputs.tag == 'v4.3.22' && inputs.verify_only != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY: ${{ inputs.only }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" == "refs/heads/Source_Code" && "$ONLY" == "macos-15" ]] || { echo "::error::The beta recovery requires Source_Code and macos-15."; exit 1; }
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v4.3.22" --jq '.object.sha' 2>/dev/null)"; then
            [[ "$existing" == "970479c2d2ffc26cb19df2ccb9c4e1ec69a4b7d0" ]] || { echo "::error::Beta tag already points to a different commit."; exit 1; }
          else
            echo "::error::The approved beta tag is missing."; exit 1
          fi

      # Verify the version BEFORE the release is created or anything is built.
      # A wrong version here is stamped into the installers and shipped to
      # users, so this is the last point at which it is still cheap to fix.
      # Note the explicit `ref`: on workflow_dispatch the default checkout is
      # the branch the run was started from, not the tag being released, so
      # without this we would validate the wrong commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      # OpenAI-Codex: use the workflow revision to generate full commit notes.
      - uses: actions/checkout@v7
        if: inputs.verify_only != true && steps.tag.outputs.tag != 'v4.3.22'
        with:
          ref: ${{ github.sha }}
          path: release-automation
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: inputs.verify_only != true && steps.tag.outputs.tag != 'v4.3.22'
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check version consistency across project files
        run: python scripts/check_version_consistency.py

      # The files can agree with each other and still disagree with the tag
      # being released -- e.g. tagging v4.3.10 on a commit that was never
      # bumped past 4.3.9. Compare the two explicitly.
      - name: Check the tag matches the project version
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          tag_version="${tag#v}"
          file_version="$(python -c "import json;print(json.load(open('package.json'))['version'])")"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag '$tag' (version '$tag_version') does not match the project version '$file_version' -- bump the version files and re-tag, or tag the correct commit."
            exit 1
          fi
          echo "Tag $tag matches project version $file_version."

      # Runs BEFORE any platform build starts, so there's no race between the
      # 3 parallel jobs over who creates the release. If a release for this
      # tag already exists (e.g. hand-crafted tri-lingual notes via
      # `gh release create`/`gh release edit`), this is a no-op and those
      # notes are left untouched — only missing releases get auto-generated
      # notes as a placeholder.
      # OpenAI-Codex: include direct commits and use the same base for PR notes.
      - name: Generate commit changelog
        id: release_notes
        if: inputs.verify_only != true && steps.tag.outputs.tag != 'v4.3.22'
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: node release-automation/.github/scripts/release-commit-notes.mjs

      - name: Ensure a GitHub Release exists for this tag
        if: inputs.verify_only != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if [ "$tag" = "v4.3.22" ]; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft and .isPrerelease' | grep -qx true
            else
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --prerelease --title "$tag Public Beta" --notes "Public Beta: download cancellation and error guidance improvements. The application identifier changed; existing installations may require manual data migration. Network stalls can delay cancellation."
            fi
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # OpenAI-Codex: never attach new builds to a published release.
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' | grep -qx true
          else
            args=(--repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$tag" --generate-notes --notes-file "$RUNNER_TEMP/release-commit-notes.md")
            previous="${{ steps.release_notes.outputs.previous_tag }}"
            if [ -n "$previous" ]; then
              args+=(--notes-start-tag "$previous")
            fi
            gh release create "$tag" "${args[@]}"
          fi

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libappindicator3-dev \
            patchelf

      - name: Build Python engine sidecar (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller yt-dlp mutagen brotli certifi requests websockets
          pyinstaller packaging/engine_sidecar.spec --noconfirm --distpath packaging/dist --workpath packaging/build

      # Two sources, and the download is verified before it is trusted.
      # johnvansickle.com once answered with HTTP 200 and a 7KB HTML error page
      # instead of the tarball, which sailed past curl and only blew up at
      # `tar` -- a build failure several steps away from its cause. `xz -t`
      # rejects anything that is not a real xz archive, so a bad response now
      # fails over to the next source instead of failing the build. Both are
      # GPL builds, matching third-party/LICENSE-ffmpeg-GPLv3.txt.
      - name: Stage ffmpeg — Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -u
          sources="
          https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          "
          got=""
          for url in $sources; do
            echo "Trying $url"
            if ! curl -fL --retry 3 --retry-delay 5 --max-time 300 -o ffmpeg.tar.xz "$url"; then
              echo "  download failed, trying the next source"
              continue
            fi
            if ! xz -t ffmpeg.tar.xz 2>/dev/null; then
              echo "  not a valid xz archive ($(wc -c < ffmpeg.tar.xz) bytes) -- probably an"
              echo "  error page served with HTTP 200; trying the next source"
              continue
            fi
            got="$url"
            break
          done
          if [ -z "$got" ]; then
            echo "::error::Could not fetch a usable ffmpeg build from any source."
            exit 1
          fi
          echo "Using $got"
          mkdir ffmpeg-dl && tar -xf ffmpeg.tar.xz -C ffmpeg-dl
          # Layouts differ between the two sources (./ffmpeg vs ./bin/ffmpeg),
          # so search rather than assuming a depth.
          bin="$(find ffmpeg-dl -name ffmpeg -type f | head -1)"
          if [ -z "$bin" ]; then
            echo "::error::No ffmpeg binary inside the archive from $got."
            exit 1
          fi
          cp "$bin" packaging/dist/engine_sidecar/ffmpeg
          chmod +x packaging/dist/engine_sidecar/ffmpeg
          packaging/dist/engine_sidecar/ffmpeg -version | head -1

      # Verified the same way as the Linux step: a download that arrives with
      # HTTP 200 but is not really an archive must fail here, not several steps
      # later inside unzip.
      #
      # Unlike Linux there is no clean second source on Apple Silicon --
      # evermeet.cx publishes x86_64 only (checked: single-arch Mach-O,
      # cputype 0x01000007), and the arm64 builds elsewhere are behind
      # version-numbered filenames that would go stale. So arm64 stays
      # single-source, and the fallback is used only where it is genuinely the
      # right architecture.
      #
      # Hence the arch check: bundling an Intel binary into an arm64 app would
      # not fail the build at all -- it would ship, and then fail on any user
      # machine without Rosetta. That is worth catching here.
      - name: Stage ffmpeg — macOS
        if: matrix.platform == 'macos-15'
        run: |
          set -u
          arch=$(uname -m)                       # arm64 on macos-15
          if [ "$arch" = "arm64" ]; then
            a=arm64
            sources="https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip"
          else
            a=amd64
            sources="
            https://ffmpeg.martin-riedl.de/redirect/latest/macos/amd64/release/ffmpeg.zip
            https://evermeet.cx/ffmpeg/getrelease/zip
            "
          fi

          got=""
          for url in $sources; do
            echo "Trying $url"
            if ! curl -fL --retry 3 --retry-delay 5 --max-time 300 -o ffmpeg.zip "$url"; then
              echo "  download failed, trying the next source"
              continue
            fi
            if ! unzip -tqq ffmpeg.zip >/dev/null 2>&1; then
              echo "  not a valid zip ($(wc -c < ffmpeg.zip) bytes) -- probably an"
              echo "  error page served with HTTP 200; trying the next source"
              continue
            fi
            got="$url"
            break
          done
          if [ -z "$got" ]; then
            echo "::error::Could not fetch a usable ffmpeg build for macOS/$a."
            exit 1
          fi
          echo "Using $got"

          rm -rf ffmpeg-dl && mkdir ffmpeg-dl && unzip -oq ffmpeg.zip -d ffmpeg-dl
          bin="$(find ffmpeg-dl -name ffmpeg -type f | head -1)"
          if [ -z "$bin" ]; then
            echo "::error::No ffmpeg binary inside the archive from $got."
            exit 1
          fi

          # An app bundled with the wrong architecture builds and ships fine,
          # then breaks on the user's machine -- check before it gets that far.
          archs="$(lipo -archs "$bin" 2>/dev/null || echo unknown)"
          echo "Binary architectures: $archs"
          case " $archs " in
            *" $arch "*) ;;
            *) echo "::error::ffmpeg from $got is built for '$archs', but this runner is $arch -- bundling it would ship an app that breaks on the user's machine."
               exit 1 ;;
          esac

          cp "$bin" packaging/dist/engine_sidecar/ffmpeg
          chmod +x packaging/dist/engine_sidecar/ffmpeg
          packaging/dist/engine_sidecar/ffmpeg -version | head -1

      - name: Stage ffmpeg — Windows
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          # OpenAI-Codex: reject HTTP errors and invalid archives before extraction.
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 --max-time 300 -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          7z t ffmpeg.zip >/dev/null
          7z x ffmpeg.zip -offmpeg-dl >/dev/null
          bin="$(find ffmpeg-dl -name ffmpeg.exe -type f -print -quit)"
          if [ -z "$bin" ]; then
            echo "::error::No ffmpeg executable found in the Windows archive."
            exit 1
          fi
          cp "$bin" packaging/dist/engine_sidecar/ffmpeg.exe
          packaging/dist/engine_sidecar/ffmpeg.exe -version | head -1

      - name: Install JS dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix frontend

      - name: Build the Tauri app
        uses: tauri-apps/tauri-action@v1

      # OpenAI-Codex: retain only installer files in verification-only runs.
      - name: Stage installers for verification
        if: inputs.verify_only == true
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve('src-tauri/target/release/bundle');
          const out = path.join(process.env.RUNNER_TEMP, 'release-verify');
          fs.mkdirSync(out);
          let count = 0;
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(file);
              else if (entry.isFile() && (/\.(rpm|deb|AppImage|dmg|msi)$/.test(entry.name) || entry.name.endsWith('-setup.exe'))) {
                fs.copyFileSync(file, path.join(out, entry.name), fs.constants.COPYFILE_EXCL);
                count++;
              }
            }
          }
          walk(root);
          if (!count) throw new Error('No installer artifacts were produced.');
          NODE

      - uses: actions/upload-artifact@v4
        if: inputs.verify_only == true
        with:
          name: release-verify-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-verify/
          if-no-files-found: error
          retention-days: 1

      - name: Upload installers to the release
        if: inputs.verify_only != true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.setup.outputs.tag }}"
          echo "Uploading bundles to release $tag"
          find src-tauri/target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) -print
          find src-tauri/target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -print0 | xargs -0 gh release upload "$tag" --repo "$GITHUB_REPOSITORY"

  # OpenAI-Codex: verify the same build jobs without changing a release.
  verify-only:
    needs: [setup, build]
    if: inputs.verify_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-verify-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/release-verify-download
      - name: Validate the complete version-specific inventory
        env:
          TAG: ${{ needs.setup.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = path.join(process.env.RUNNER_TEMP, 'release-verify-download');
          const assets = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(file);
              else if (entry.isFile()) assets.push({ name: entry.name, size: fs.statSync(file).size });
              else throw new Error('Unexpected artifact entry.');
            }
          }
          walk(root);
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'release-verify-assets.json'), JSON.stringify({ assets }));
          NODE
          node automation/.github/scripts/verify-release-assets.mjs "$TAG" "$RUNNER_TEMP/release-verify-assets.json" staged

  # OpenAI-Codex: apply the same asset and exact-commit checks to beta publication.
  publish-beta:
    needs: [setup, build]
    if: inputs.verify_only != true && needs.setup.outputs.tag == 'v4.3.22'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: v4.3.22
          path: beta-source
          persist-credentials: false
      - name: Verify exact beta assets and checks before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v4.3.22 --repo "$GITHUB_REPOSITORY" --json assets,isDraft,isPrerelease > "$RUNNER_TEMP/beta-release.json"
          jq -e '.isDraft == true and .isPrerelease == true' "$RUNNER_TEMP/beta-release.json" >/dev/null
          node automation/.github/scripts/verify-release-assets.mjs v4.3.22 "$RUNNER_TEMP/beta-release.json"
          sha="$(git -C beta-source rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          verified=false
          for attempt in $(seq 1 60); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&per_page=100")"
            if BETA_SHA="$sha" node -e '
            const fs = require("fs");
            try {
              const data = JSON.parse(fs.readFileSync(0, "utf8"));
              if (!/^[0-9a-f]{40}$/.test(process.env.BETA_SHA || "") ||
                  !Array.isArray(data.workflow_runs) || !Number.isSafeInteger(data.total_count) ||
                  data.total_count > 100 || data.total_count !== data.workflow_runs.length) process.exit(1);
              for (const path of [".github/workflows/ci.yml", ".github/workflows/python-matrix.yml"]) {
                const matching = data.workflow_runs.filter(r => r.path === path && r.head_sha === process.env.BETA_SHA &&
                  r.head_branch === "Source_Code" && ["push", "workflow_dispatch"].includes(r.event));
                if (matching.some(r => !Number.isSafeInteger(r.id) || r.id < 1)) process.exit(1);
                const run = matching.sort((a, b) => b.id - a.id)[0];
                if (!run || run.status !== "completed" || run.conclusion !== "success") process.exit(1);
              }
            } catch { process.exit(1); }
            ' <<< "$runs"; then
              verified=true
              break
            fi
            echo "Waiting for beta CI and matrix on $sha ($attempt/60)."
            sleep 10
          done
          [[ "$verified" == true ]] || { echo "::error::Beta CI and matrix must pass for the tagged Source_Code commit."; exit 1; }
          gh release edit v4.3.22 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false

  # OpenAI-Codex: publish only complete builds of a commit with passing CI.
  publish-stable:
    needs: [setup, build]
    if: inputs.verify_only != true && needs.setup.outputs.tag != 'v4.3.22' && needs.setup.outputs.tag != 'v4.3.3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.tag }}
      - name: Verify installers and exact-commit tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.setup.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          # OpenAI-Codex: require the expected names and nonempty files for this exact version.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/release-assets.json"
          node .github/scripts/verify-release-assets.mjs "$TAG" "$RUNNER_TEMP/release-assets.json"
          verified=false
          for attempt in $(seq 1 60); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&per_page=100")"
            if SHA="$sha" node -e '
            const fs = require("fs");
            try {
              const data = JSON.parse(fs.readFileSync(0, "utf8"));
              if (!Array.isArray(data.workflow_runs) || data.total_count > 100) process.exit(1);
              for (const path of [".github/workflows/ci.yml", ".github/workflows/python-matrix.yml"]) {
                const run = data.workflow_runs.filter(r => r.path === path && r.head_sha === process.env.SHA &&
                  r.head_branch === "Source_Code" && ["push", "workflow_dispatch"].includes(r.event))
                  .sort((a, b) => b.id - a.id)[0];
                if (!run || run.status !== "completed" || run.conclusion !== "success") process.exit(1);
              }
            } catch { process.exit(1); }
            ' <<< "$runs"; then
              verified=true
              break
            fi
            echo "Waiting for both checks on $sha ($attempt/60)."
            sleep 10
          done
          [ "$verified" = true ] || { echo "::error::CI and matrix must both pass for the tagged Source_Code commit."; exit 1; }
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # OpenAI-Codex: dispatch package publication after a verified stable release.
  request-npm-package:
    needs: [setup, publish-stable]
    if: needs.publish-stable.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Queue verified npm package publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.setup.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run npm-package.yml --repo "$GITHUB_REPOSITORY" --ref Source_Code -f mode=release -f tag="$TAG"
