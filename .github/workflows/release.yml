name: Release build

# Builds the desktop installers for Linux, macOS, and Windows and uploads them
# to the matching GitHub Release. It can run on a version tag push (v*), be
# started manually against an existing tag, or be called by the automatic patch
# release workflow after a pull request is merged into `Source_Code`.
# This workflow creates the GitHub Release automatically if one doesn't
# already exist for the tag (with
# GitHub's auto-generated notes as a placeholder) and uploads all 3
# platforms' installers to it. Polished tri-lingual release notes can be
# added afterwards with `gh release edit vX.Y.Z --notes-file ...` — that's
# independent of the build/upload and can happen before or after.

on:
  pull_request:
    branches: [Source_Code]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-build.yml
      - .github/scripts/upload-release-assets.mjs
      - .github/scripts/verify-tag-protection.mjs
      - .github/scripts/verify-tag-protection.test.mjs
      - .github/scripts/release-upload-create-only.test.mjs
      - .github/scripts/select-release-artifacts.mjs
      - .github/scripts/select-release-artifacts.test.mjs
      - .github/scripts/download-release-artifacts.py
      - .github/scripts/download-release-artifacts.test.py
      - .github/scripts/stage-release-artifacts.py
      - .github/scripts/stage-release-artifacts.test.py
      - .github/scripts/verify-version-at-commit.mjs
      - .github/scripts/verify-version-at-commit.test.mjs
      - .github/scripts/release-input-guard.test.mjs
      - .github/scripts/release-commit-notes.test.mjs
      - .github/scripts/verify-release-assets.mjs
      - .github/scripts/release-commit-notes.mjs

  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach installers to (e.g. v4.1.0)"
        required: true
        default: v4.1.0
      only:
        description: "Limit the build to one platform (default: all)"
        type: choice
        default: all
        options:
          - all
          - ubuntu-22.04
          - macos-15
          - windows-latest
      verify_only:
        description: Build and verify artifacts without modifying a GitHub Release
        type: boolean
        default: false
        required: false
  workflow_call:
    inputs:
      tag:
        description: "Version tag to build"
        required: true
        type: string
      only:
        description: "Limit the build to one platform (default: all)"
        required: false
        default: all
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # OpenAI-Codex_format_architecture: resolve immutable source before any tag code runs.
  metadata:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.user.id == 157894869 &&
       github.event.sender.id == 157894869 &&
       github.event.pull_request.head.ref == 'automation/protected-workflows' &&
       github.event.pull_request.base.ref == 'Source_Code' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.base.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      workflow_sha: ${{ steps.source.outputs.workflow_sha }}
      tag: ${{ steps.source.outputs.tag }}
      verify_only: ${{ steps.source.outputs.verify_only }}
    steps:
      - name: Validate tag and resolve its trusted source
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          ONLY: ${{ inputs.only || github.event.inputs.only || 'all' }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_PATH: ${{ job.workflow_file_path }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == KingsleyHK0323/Multimedia_Downloader ]]
          [[ "$WORKFLOW_REPOSITORY" == "$GITHUB_REPOSITORY" && "$WORKFLOW_PATH" == .github/workflows/release.yml ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            [[ "$GITHUB_HEAD_REF" == automation/protected-workflows && "$GITHUB_BASE_REF" == Source_Code ]] || {
              echo '::error::PR branch names do not exactly match the approved verification scope.'
              exit 1
            }
            [[ "$GITHUB_REF" =~ ^refs/pull/[1-9][0-9]*/merge$ ]]
            [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$PR_HEAD" =~ ^[0-9a-f]{40}$ && "$PR_BASE" =~ ^[0-9a-f]{40}$ ]]
            [[ "$WORKFLOW_SHA" == "$GITHUB_SHA" || "$WORKFLOW_SHA" == "$PR_HEAD" ]]
            commit="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA")"
            jq -e --arg base "$PR_BASE" --arg head "$PR_HEAD" \
              '.parents | length == 2 and .[0].sha == $base and .[1].sha == $head' <<< "$commit" >/dev/null
            package="$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$GITHUB_SHA" --jq .content | base64 --decode)"
            TAG="v$(jq -er '.version | select(type == "string")' <<< "$package")"
            VERIFY_ONLY=true
            ONLY=all
          fi
          [[ ${#TAG} -le 51 && "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          case "$ONLY" in all|ubuntu-22.04|macos-15|windows-latest) ;; *) echo '::error::Invalid release platform.'; exit 1 ;; esac
          if [[ "$TAG" == v4.3.3 && "$VERIFY_ONLY" != true ]]; then
            echo '::error::v4.3.3 requires separate authorization after testing.'
            exit 1
          fi
          case "$GITHUB_EVENT_NAME" in
            push)
              [[ "$GITHUB_REF" == "refs/tags/$TAG" ]] || { echo '::error::Push event and tag do not match.'; exit 1; }
              ;;
            workflow_dispatch|pull_request_target)
              [[ "$GITHUB_REF" == refs/heads/Source_Code ]] || { echo '::error::Release must run from Source_Code.'; exit 1; }
              ;;
            pull_request) ;;
            *) echo '::error::Unsupported release event.'; exit 1 ;;
          esac
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            sha="$GITHUB_SHA"
          else
            item="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
            for attempt in $(seq 1 8); do
              type="$(jq -er '.object.type' <<< "$item")"
              sha="$(jq -er '.object.sha' <<< "$item")"
              [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
              if [[ "$type" == commit ]]; then break; fi
              [[ "$type" == tag ]] || { echo '::error::Invalid tag object.'; exit 1; }
              item="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha")"
            done
            [[ "$type" == commit ]] || { echo '::error::Tag chain is too deep.'; exit 1; }
            if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_SHA" != "$sha" ]]; then
              echo '::error::Tag push and resolved commit differ.'
              exit 1
            fi
            # Both immutable commits must be part of the current Source_Code history.
            for candidate in "$sha" "$WORKFLOW_SHA"; do
              relation="$(gh api "repos/$GITHUB_REPOSITORY/compare/$candidate...Source_Code")"
              jq -e --arg wanted "$candidate" '
                .merge_base_commit.sha == $wanted and .behind_by == 0 and
                (.status == "ahead" or .status == "identical")
              ' <<< "$relation" >/dev/null
            done
          fi
          if [[ "$VERIFY_ONLY" == true ]]; then verify=true; else verify=false; fi
          printf 'source_sha=%s\nworkflow_sha=%s\ntag=%s\nverify_only=%s\n' "$sha" "$WORKFLOW_SHA" "$TAG" "$verify" >> "$GITHUB_OUTPUT"

  setup:
    needs: [metadata]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # OpenAI-Codex: validate inputs before existing shell interpolation.
      # BEGIN RELEASE_INPUT_GUARD
      - name: Validate release inputs
        env:
          RAW_TAG: ${{ needs.metadata.outputs.tag }}
          RAW_ONLY: ${{ inputs.only || github.event.inputs.only || 'all' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ${#RAW_TAG} -gt 51 ]] || [[ ! "$RAW_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf '%s\n' '::error::Invalid release tag.'
            exit 1
          fi
          case "$RAW_ONLY" in
            all|ubuntu-22.04|macos-15|windows-latest) ;;
            *) printf '%s\n' '::error::Invalid release platform.'; exit 1 ;;
          esac
      # END RELEASE_INPUT_GUARD
      # OpenAI-Codex: keep validated user input out of generated shell code.
      - id: tag
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        shell: bash
        run: printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - id: m
        env:
          RELEASE_ONLY: ${{ inputs.only || github.event.inputs.only || 'all' }}
        shell: bash
        run: |
          only="$RELEASE_ONLY"
          if [ "$only" = "all" ]; then
            echo 'matrix={"platform":["ubuntu-22.04","macos-15","windows-latest"]}' >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"platform\":[\"$only\"]}" >> "$GITHUB_OUTPUT"
          fi

      # OpenAI-Codex: verification cannot publish and must cover all platforms.
      - name: Validate verification-only mode
        if: needs.metadata.outputs.verify_only == 'true'
        env:
          SOURCE_REF: ${{ github.ref }}
          ONLY: ${{ inputs.only || 'all' }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ONLY" == all ]] || { echo "::error::Verification requires all platforms."; exit 1; }
          case "$EVENT" in
            workflow_dispatch) [[ "$SOURCE_REF" == refs/heads/Source_Code ]] ;;
            pull_request) [[ "$SOURCE_REF" =~ ^refs/pull/[1-9][0-9]*/merge$ ]] ;;
            *) exit 1 ;;
          esac

      # OpenAI-Codex: create the requested beta tag only from Source_Code.
      - name: Prepare v4.3.22 beta tag
        if: github.event_name == 'workflow_dispatch' && steps.tag.outputs.tag == 'v4.3.22' && inputs.verify_only != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY: ${{ inputs.only }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" == "refs/heads/Source_Code" && "$ONLY" == "macos-15" ]] || { echo "::error::The beta recovery requires Source_Code and macos-15."; exit 1; }
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v4.3.22" --jq '.object.sha' 2>/dev/null)"; then
            [[ "$existing" == "970479c2d2ffc26cb19df2ccb9c4e1ec69a4b7d0" ]] || { echo "::error::Beta tag already points to a different commit."; exit 1; }
          else
            echo "::error::The approved beta tag is missing."; exit 1
          fi

      # Verify the version BEFORE the release is created or anything is built.
      # A wrong version here is stamped into the installers and shipped to
      # users, so this is the last point at which it is still cheap to fix.
      # Note the explicit `ref`: on workflow_dispatch the default checkout is
      # the branch the run was started from, not the tag being released, so
      # without this we would validate the wrong commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check version consistency across project files
        run: python -I scripts/check_version_consistency.py

      # The files can agree with each other and still disagree with the tag
      # being released -- e.g. tagging v4.3.10 on a commit that was never
      # bumped past 4.3.9. Compare the two explicitly.
      # OpenAI-Codex: keep the validated tag out of generated shell code.
      - name: Check the tag matches the project version
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          tag="$RELEASE_TAG"
          tag_version="${tag#v}"
          file_version="$(python -I -c "import json;print(json.load(open('package.json'))['version'])")"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag '$tag' (version '$tag_version') does not match the project version '$file_version' -- bump the version files and re-tag, or tag the correct commit."
            exit 1
          fi
          echo "Tag $tag matches project version $file_version."


  build-linux:
    if: >-
      (inputs.only || github.event.inputs.only || 'all') == 'all' ||
      (inputs.only || github.event.inputs.only || 'all') == 'ubuntu-22.04'
    needs: [metadata, setup]
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      platform: 'ubuntu-22.04'
      source_sha: ${{ needs.metadata.outputs.source_sha }}
      verify_only: ${{ needs.metadata.outputs.verify_only == 'true' }}

  build-macos:
    if: >-
      (inputs.only || github.event.inputs.only || 'all') == 'all' ||
      (inputs.only || github.event.inputs.only || 'all') == 'macos-15'
    needs: [metadata, setup]
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      platform: 'macos-15'
      source_sha: ${{ needs.metadata.outputs.source_sha }}
      verify_only: ${{ needs.metadata.outputs.verify_only == 'true' }}

  build-windows:
    if: >-
      (inputs.only || github.event.inputs.only || 'all') == 'all' ||
      (inputs.only || github.event.inputs.only || 'all') == 'windows-latest'
    needs: [metadata, setup]
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      platform: 'windows-latest'
      source_sha: ${{ needs.metadata.outputs.source_sha }}
      verify_only: ${{ needs.metadata.outputs.verify_only == 'true' }}

  # OpenAI-Codex: verify the same build jobs without changing a release.
  verify-only:
    needs: [metadata, setup, build-linux, build-macos, build-windows]
    if: needs.metadata.outputs.verify_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: automation
          persist-credentials: false
      # OpenAI-Codex_format_architecture: verify tag rules using this job's own token.
      - name: Verify version-tag protections
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node automation/.github/scripts/verify-tag-protection.mjs
      - name: Verify build artifact identities
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINUX_ID: ${{ needs.build-linux.outputs.artifact_id }}
          MAC_ID: ${{ needs.build-macos.outputs.artifact_id }}
          WINDOWS_ID: ${{ needs.build-windows.outputs.artifact_id }}
          LINUX_JOB_ID: ${{ needs.build-linux.outputs.job_id }}
          MAC_JOB_ID: ${{ needs.build-macos.outputs.job_id }}
          WINDOWS_JOB_ID: ${{ needs.build-windows.outputs.job_id }}
          LINUX_DIGEST: ${{ needs.build-linux.outputs.artifact_digest }}
          MAC_DIGEST: ${{ needs.build-macos.outputs.artifact_digest }}
          WINDOWS_DIGEST: ${{ needs.build-windows.outputs.artifact_digest }}
          RELEASE_ONLY: all
          TAG: ${{ needs.metadata.outputs.tag }}
          VERIFY_ONLY: 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/release-artifact-pages.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" > "$RUNNER_TEMP/release-job-pages.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/release-run.json"
          node automation/.github/scripts/select-release-artifacts.mjs "$RUNNER_TEMP/release-artifact-pages.json" "$RUNNER_TEMP/release-job-pages.json" "$RUNNER_TEMP/release-run.json" > "$RUNNER_TEMP/release-selection.json"
          mkdir "$RUNNER_TEMP/release-download" "$RUNNER_TEMP/release-stage"
          python -I automation/.github/scripts/download-release-artifacts.py "$RUNNER_TEMP/release-selection.json" "$RUNNER_TEMP/release-download"
          python -I automation/.github/scripts/stage-release-artifacts.py "$TAG" "$RUNNER_TEMP/release-stage" "$RUNNER_TEMP/release-selection.json" "$RUNNER_TEMP/release-download" > "$RUNNER_TEMP/release-stage-manifest.json"
          node -e 'const fs=require("node:fs");const p=process.env.RUNNER_TEMP;const a=JSON.parse(fs.readFileSync(p+"/release-stage-manifest.json","utf8"));fs.writeFileSync(p+"/release-verify-assets.json",JSON.stringify({assets:a}));'
          node automation/.github/scripts/verify-release-assets.mjs "$TAG" "$RUNNER_TEMP/release-verify-assets.json"


  # OpenAI-Codex_format_architecture: fresh runner; artifacts are treated only as data.
  publisher:
    needs: [metadata, setup, build-linux, build-macos, build-windows]
    if: >-
      !cancelled() && github.event_name != 'pull_request' && needs.metadata.outputs.verify_only != 'true' &&
      needs.metadata.result == 'success' && needs.setup.result == 'success' &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') &&
      (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.build-linux.result == 'success' || needs.build-macos.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      asset_manifest: ${{ steps.staging.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: automation
          fetch-depth: 0
          persist-credentials: false
      - name: Verify version data at the immutable source commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_TARGET_SHA: ${{ needs.metadata.outputs.source_sha }}
        run: node automation/.github/scripts/verify-version-at-commit.mjs
      - name: Resolve and verify build artifact identities
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINUX_ID: ${{ needs.build-linux.outputs.artifact_id }}
          LINUX_JOB_ID: ${{ needs.build-linux.outputs.job_id }}
          MAC_ID: ${{ needs.build-macos.outputs.artifact_id }}
          MAC_JOB_ID: ${{ needs.build-macos.outputs.job_id }}
          WINDOWS_ID: ${{ needs.build-windows.outputs.artifact_id }}
          WINDOWS_JOB_ID: ${{ needs.build-windows.outputs.job_id }}
          LINUX_DIGEST: ${{ needs.build-linux.outputs.artifact_digest }}
          MAC_DIGEST: ${{ needs.build-macos.outputs.artifact_digest }}
          WINDOWS_DIGEST: ${{ needs.build-windows.outputs.artifact_digest }}
          RELEASE_ONLY: ${{ inputs.only || github.event.inputs.only || 'all' }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/release-artifact-pages.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" > "$RUNNER_TEMP/release-job-pages.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/release-run.json"
          node automation/.github/scripts/select-release-artifacts.mjs "$RUNNER_TEMP/release-artifact-pages.json" "$RUNNER_TEMP/release-job-pages.json" "$RUNNER_TEMP/release-run.json" > "$RUNNER_TEMP/release-selection.json"
      - name: Download and safely stage installer data
        id: staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/release-download" "$RUNNER_TEMP/release-stage"
          python -I automation/.github/scripts/download-release-artifacts.py "$RUNNER_TEMP/release-selection.json" "$RUNNER_TEMP/release-download"
          python -I automation/.github/scripts/stage-release-artifacts.py "$TAG" "$RUNNER_TEMP/release-stage" "$RUNNER_TEMP/release-selection.json" "$RUNNER_TEMP/release-download" > "$RUNNER_TEMP/release-staged-manifest.json"
          encoded="$(base64 -w 0 "$RUNNER_TEMP/release-staged-manifest.json")"
          [[ ${#encoded} -le 100000 ]]
          printf 'manifest=%s\n' "$encoded" >> "$GITHUB_OUTPUT"
      - name: Generate release notes from trusted automation
        id: release_notes
        if: needs.metadata.outputs.tag != 'v4.3.22' && (inputs.only || github.event.inputs.only || 'all') == 'all'
        working-directory: automation
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: node .github/scripts/release-commit-notes.mjs
      # OpenAI-Codex_format_architecture: verify tag rules using this job's own token.
      - name: Verify version-tag protections
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node automation/.github/scripts/verify-tag-protection.mjs
      - name: Create or verify the draft release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          TARGET_SHA: ${{ needs.metadata.outputs.source_sha }}
          PREVIOUS_TAG: ${{ steps.release_notes.outputs.previous_tag }}
          RELEASE_ONLY: ${{ inputs.only || github.event.inputs.only || 'all' }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const target = process.env.TARGET_SHA;
            if (owner !== 'KingsleyHK0323' || repo !== 'Multimedia_Downloader' ||
                !/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(tag) ||
                tag === 'v4.3.3' || !/^[0-9a-f]{40}$/.test(target)) throw new Error('Invalid release target.');
            const params = { owner, repo };
            let object = (await github.rest.git.getRef({ ...params, ref: 'tags/' + tag })).data.object;
            for (let i = 0; i < 8 && object?.type === 'tag'; i++) {
              object = (await github.rest.git.getTag({ ...params, tag_sha: object.sha })).data.object;
            }
            if (object?.type !== 'commit' || object.sha !== target) throw new Error('Tag target changed.');
            // OpenAI-Codex: only explicitly approved tags use the Public Beta path.
            const beta = tag === 'v4.3.22' || tag === 'v4.3.23' || tag === 'v4.3.24';
            // OpenAI-Codex: list releases because getReleaseByTag excludes drafts.
            const findRelease = async () => {
              const releases = await github.paginate(github.rest.repos.listReleases, { ...params, per_page: 100 });
              if (!Array.isArray(releases)) throw new Error('Invalid release listing.');
              const matches = releases.filter(item => item?.tag_name === tag);
              if (matches.length > 1) throw new Error('Ambiguous releases for tag.');
              return matches[0] || null;
            };
            let release = await findRelease();
            if (!release) {
              if (process.env.RELEASE_ONLY !== 'all') throw new Error('Partial recovery requires an existing draft release.');
              const legacyBeta = tag === 'v4.3.22';
              const notes = legacyBeta
                ? 'Public Beta: download cancellation and error guidance improvements. The application identifier changed; existing installations may require manual data migration. Network stalls can delay cancellation.'
                : fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'release-commit-notes.md'), 'utf8');
              let body = notes;
              if (tag === 'v4.3.23') {
                body = 'Public Beta: automated checks pass, but the reported Windows progress and BiliBili download scenarios have not been verified in real use. Some build dependencies are not fully pinned.\n\n' + body;
              }
              if (tag === 'v4.3.24') {
                body = 'Public Beta: desktop download, conversion and new icons have not been verified in real use. Some build dependencies are not fully pinned.\n\n' + body;
              }
              if (!legacyBeta) {
                const previous = process.env.PREVIOUS_TAG || '';
                if (previous && !/^v[0-9A-Za-z._-]+$/.test(previous)) throw new Error('Invalid previous tag.');
                const parameters = { ...params, tag_name: tag, target_commitish: target };
                if (previous) parameters.previous_tag_name = previous;
                const generated = (await github.rest.repos.generateReleaseNotes(parameters)).data;
                if (typeof generated.body !== 'string') throw new Error('Invalid generated release notes.');
                body += '\n\n' + generated.body;
              }
              const options = { ...params, tag_name: tag, target_commitish: target, draft: true, prerelease: beta,
                name: beta ? tag + ' Public Beta' : tag, body };
              try {
                release = (await github.rest.repos.createRelease(options)).data;
              } catch (createError) {
                if (createError.status !== 422) throw createError;
                release = await findRelease();
                if (!release) throw createError;
              }
            }
            if (release.tag_name !== tag || release.draft !== true ||
                release.prerelease !== beta) {
              throw new Error('Release is not the expected draft.');
            }
      # OpenAI-Codex_format_architecture: verify tag rules using this job's own token.
      - name: Verify version-tag protections
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node automation/.github/scripts/verify-tag-protection.mjs
      - name: Upload or verify exact release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_TARGET_SHA: ${{ needs.metadata.outputs.source_sha }}
          RELEASE_STAGE_DIR: ${{ runner.temp }}/release-stage
          RELEASE_ONLY: ${{ inputs.only || github.event.inputs.only || 'all' }}
        shell: bash
        run: node automation/.github/scripts/upload-release-assets.mjs "$RELEASE_TAG"

  # OpenAI-Codex: apply the same asset and exact-commit checks to beta publication.
  publish-beta:
    needs: [metadata, setup, publisher]
    permissions:
      contents: write
      actions: read
    if: github.event_name != 'pull_request' && needs.metadata.outputs.verify_only != 'true' && (inputs.only || github.event.inputs.only || 'all') == 'all' && (needs.metadata.outputs.tag == 'v4.3.22' || needs.metadata.outputs.tag == 'v4.3.23' || needs.metadata.outputs.tag == 'v4.3.24')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ job.workflow_sha }}
          path: automation
          persist-credentials: false
      - name: Verify exact beta assets and checks before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TARGET_SHA: ${{ needs.metadata.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_MANIFEST: ${{ needs.publisher.outputs.asset_manifest }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          [[ "$TAG" == v4.3.22 || "$TAG" == v4.3.23 || "$TAG" == v4.3.24 ]] || exit 1
          node automation/.github/scripts/upload-release-assets.mjs "$TAG" --verify-inventory
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,isDraft,isPrerelease > "$RUNNER_TEMP/beta-release.json"
          jq -e '.isDraft == true and .isPrerelease == true' "$RUNNER_TEMP/beta-release.json" >/dev/null
          node automation/.github/scripts/verify-release-assets.mjs "$TAG" "$RUNNER_TEMP/beta-release.json"
          sha="$RELEASE_TARGET_SHA"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          verified=false
          for attempt in $(seq 1 60); do
            # OpenAI-Codex: paginate only the two required workflows for this exact source branch.
            ci_pages="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&branch=Source_Code&per_page=100")"
            matrix_pages="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/python-matrix.yml/runs?head_sha=$sha&branch=Source_Code&per_page=100")"
            runs="$(jq -cn --argjson ci "$ci_pages" --argjson matrix "$matrix_pages" '
              def collect:
                if type != "array" or length == 0 then error("Missing workflow pages") else . end
                | . as $pages
                | $pages[0].total_count as $total
                | if ($total | type) != "number" or ($total | floor) != $total or $total < 0
                    or any($pages[]; .total_count != $total or (.workflow_runs | type) != "array")
                  then error("Invalid workflow pages") else . end
                | [$pages[].workflow_runs[]] as $items
                | if ($items | length) == $total and ([$items[].id] | unique | length) == $total
                  then $items else error("Incomplete or duplicate workflow pages") end;
              ($ci | collect) as $a | ($matrix | collect) as $b |
              {total_count: (($a | length) + ($b | length)), workflow_runs: ($a + $b)}
            ')" || runs='{}'
            if BETA_SHA="$sha" node -e '
            const fs = require("fs");
            try {
              const data = JSON.parse(fs.readFileSync(0, "utf8"));
              if (!/^[0-9a-f]{40}$/.test(process.env.BETA_SHA || "") ||
                  !Array.isArray(data.workflow_runs) || !Number.isSafeInteger(data.total_count) ||
                  data.total_count < 0 || data.total_count !== data.workflow_runs.length) process.exit(1);
              for (const path of [".github/workflows/ci.yml", ".github/workflows/python-matrix.yml"]) {
                const matching = data.workflow_runs.filter(r => r.path === path && r.head_sha === process.env.BETA_SHA &&
                  r.head_branch === "Source_Code" && ["push", "workflow_dispatch"].includes(r.event));
                if (matching.some(r => !Number.isSafeInteger(r.id) || r.id < 1)) process.exit(1);
                const run = matching.sort((a, b) => b.id - a.id)[0];
                if (!run || run.status !== "completed" || run.conclusion !== "success") process.exit(1);
              }
            } catch { process.exit(1); }
            ' <<< "$runs"; then
              verified=true
              break
            fi
            echo "Waiting for beta CI and matrix on $sha ($attempt/60)."
            sleep 10
          done
          [[ "$verified" == true ]] || { echo "::error::Beta CI and matrix must pass for the tagged Source_Code commit."; exit 1; }
          node automation/.github/scripts/upload-release-assets.mjs "$TAG" --verify-inventory
          node automation/.github/scripts/verify-tag-protection.mjs
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false

  # OpenAI-Codex: publish only complete builds of a commit with passing CI.
  publish-stable:
    needs: [metadata, setup, publisher]
    permissions:
      contents: write
      actions: read
    if: github.event_name != 'pull_request' && needs.metadata.outputs.verify_only != 'true' && (inputs.only || github.event.inputs.only || 'all') == 'all' && needs.metadata.outputs.tag != 'v4.3.22' && needs.metadata.outputs.tag != 'v4.3.23' && needs.metadata.outputs.tag != 'v4.3.24' && needs.metadata.outputs.tag != 'v4.3.3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
