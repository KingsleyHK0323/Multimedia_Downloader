        shell: bash
        run: |
          set -euo pipefail
          sha="$RELEASE_TARGET_SHA"
          node automation/.github/scripts/upload-release-assets.mjs "$TAG" --verify-inventory
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          # OpenAI-Codex: require the expected names and nonempty files for this exact version.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/release-assets.json"
          node automation/.github/scripts/verify-release-assets.mjs "$TAG" "$RUNNER_TEMP/release-assets.json"
          verified=false
          for attempt in $(seq 1 60); do
            # OpenAI-Codex: paginate only the two required workflows for this exact source branch.
            ci_pages="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&branch=Source_Code&per_page=100")"
            matrix_pages="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/python-matrix.yml/runs?head_sha=$sha&branch=Source_Code&per_page=100")"
            runs="$(jq -cn --argjson ci "$ci_pages" --argjson matrix "$matrix_pages" '
              def collect:
                if type != "array" or length == 0 then error("Missing workflow pages") else . end
                | . as $pages
                | $pages[0].total_count as $total
                | if ($total | type) != "number" or ($total | floor) != $total or $total < 0
                    or any($pages[]; .total_count != $total or (.workflow_runs | type) != "array")
                  then error("Invalid workflow pages") else . end
                | [$pages[].workflow_runs[]] as $items
                | if ($items | length) == $total and ([$items[].id] | unique | length) == $total
                  then $items else error("Incomplete or duplicate workflow pages") end;
              ($ci | collect) as $a | ($matrix | collect) as $b |
              {total_count: (($a | length) + ($b | length)), workflow_runs: ($a + $b)}
            ')" || runs='{}'
            if SHA="$sha" node -e '
            const fs = require("fs");
            try {
              const data = JSON.parse(fs.readFileSync(0, "utf8"));
              if (!Array.isArray(data.workflow_runs) || !Number.isSafeInteger(data.total_count) ||
                  data.total_count < 0 || data.total_count !== data.workflow_runs.length) process.exit(1);
              for (const path of [".github/workflows/ci.yml", ".github/workflows/python-matrix.yml"]) {
                const run = data.workflow_runs.filter(r => r.path === path && r.head_sha === process.env.SHA &&
                  r.head_branch === "Source_Code" && ["push", "workflow_dispatch"].includes(r.event))
                  .sort((a, b) => b.id - a.id)[0];
                if (!run || run.status !== "completed" || run.conclusion !== "success") process.exit(1);
              }
            } catch { process.exit(1); }
            ' <<< "$runs"; then
              verified=true
              break
            fi
            echo "Waiting for both checks on $sha ($attempt/60)."
            sleep 10
          done
          [ "$verified" = true ] || { echo "::error::CI and matrix must both pass for the tagged Source_Code commit."; exit 1; }
          node automation/.github/scripts/upload-release-assets.mjs "$TAG" --verify-inventory
          node automation/.github/scripts/verify-tag-protection.mjs
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # OpenAI-Codex: dispatch package publication after a verified stable release.
  request-npm-package:
    needs: [metadata, setup, publish-stable]
    if: github.event_name != 'pull_request' && needs.publish-stable.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Queue verified npm package publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run npm-package.yml --repo "$GITHUB_REPOSITORY" --ref Source_Code -f mode=release -f tag="$TAG"
