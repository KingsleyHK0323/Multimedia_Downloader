# OpenAI-Codex_Fork_GitHub_REPO: support CLI, TUI and Termux reports and safer log sharing.
name: 🐛 Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a report. Please fill in as much as you can.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "e.g. 4.1.0 (see the installer filename or the app title bar)"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How are you running it?
      options:
        - Desktop app (installer)
        - Web app (web_app.py)
        - From source (npm run tauri dev)
        - Command-line interface (CLI)
        - Terminal user interface (TUI)
        - Android Termux
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux, macOS, Android]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the ... tab
        2. Paste ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Run Log output
      description: Share only relevant log excerpts after removing credentials, tokens, private URLs, and personal information. Report vulnerabilities through [private security reporting](https://github.com/KingsleyHK0323/Multimedia_Downloader/security/advisories/new).
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
